<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUA 27 — Moda Urbana</title>
<style>
:root{
  --bg:#f5f4f1; --surface:#ffffff; --text:#141414; --muted:#6b6b6b;
  --line:#e2e0da; --accent:#d7ff3a; --accent-text:#141414; --danger:#c62828;
  --shadow:0 10px 40px rgba(0,0,0,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f10; --surface:#1a1a1c; --text:#f2f2f0; --muted:#9a9a9a;
    --line:#2b2b2e; --danger:#ff6b6b; --shadow:0 10px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f10; --surface:#1a1a1c; --text:#f2f2f0; --muted:#9a9a9a;
  --line:#2b2b2e; --danger:#ff6b6b; --shadow:0 10px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Helvetica Neue",Arial,system-ui,sans-serif;line-height:1.4}
button{font:inherit;cursor:pointer}

/* Cabeçalho */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;
  align-items:center;justify-content:space-between;padding:14px 5vw;
  background:var(--surface);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:.12em;font-size:1.3rem}
.logo span{background:var(--accent);color:var(--accent-text);padding:0 6px;margin-left:4px}
.cart-btn{position:relative;background:none;border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;color:var(--text);display:flex;align-items:center;gap:8px}
.cart-btn svg{width:20px;height:20px}
.badge{min-width:22px;height:22px;border-radius:999px;background:var(--accent);
  color:var(--accent-text);font-size:.75rem;font-weight:800;display:grid;place-items:center;padding:0 6px}
.badge.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.35)}}

/* Hero */
.hero{padding:48px 5vw 16px}
.hero h1{margin:0;font-size:clamp(2rem,6vw,3.6rem);line-height:1;letter-spacing:-.02em;text-transform:uppercase}
.hero p{color:var(--muted);margin:10px 0 0;max-width:46ch}

/* Grade de produtos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;padding:24px 5vw 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line)}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:1rem}
.cat{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.price{font-weight:800;font-size:1.15rem;margin-top:auto}
.add{margin-top:8px;border:0;border-radius:10px;padding:11px;font-weight:800;
  background:var(--text);color:var(--bg);transition:background .2s,color .2s}
.add:hover{background:var(--accent);color:var(--accent-text)}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:30}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--surface);
  z-index:40;display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);
  padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:1.1rem;text-transform:uppercase;letter-spacing:.08em}
.close{background:none;border:0;color:var(--text);font-size:1.6rem;line-height:1}
.items{flex:1;overflow-y:auto;padding:8px 20px}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;
  padding:14px 0;border-bottom:1px solid var(--line)}
.item img{width:64px;height:64px;border-radius:8px;object-fit:cover}
.item h4{margin:0;font-size:.95rem}
.item .unit{color:var(--muted);font-size:.85rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.qty button{width:28px;height:28px;border:0;background:none;color:var(--text);font-size:1rem}
.qty span{min-width:24px;text-align:center;font-size:.9rem}
.line-total{font-weight:800;text-align:right}
.remove{display:block;margin-top:6px;background:none;border:0;color:var(--danger);font-size:.8rem;padding:0}
.drawer-foot{padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;margin-bottom:14px}
.checkout{width:100%;border:0;border-radius:10px;padding:14px;font-weight:800;
  background:var(--accent);color:var(--accent-text)}
.checkout:disabled{opacity:.4;cursor:not-allowed}
.clear{width:100%;margin-top:8px;background:none;border:0;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;
  border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="logo">RUA<span>27</span></div>
  <button class="cart-btn" id="openCart" aria-label="Abrir carrinho">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
    <span class="badge" id="count">0</span>
  </button>
</header>

<section class="hero">
  <h1>Coleção<br>Asfalto 26</h1>
  <p>Moda urbana feita para a cidade. Peças oversized, tecidos pesados e zero pressa.</p>
</section>

<main class="grid" id="grid"></main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Carrinho de compras">
  <div class="drawer-head">
    <h2>Seu carrinho</h2>
    <button class="close" id="closeCart" aria-label="Fechar carrinho">×</button>
  </div>
  <div class="items" id="items"></div>
  <div class="drawer-foot">
    <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
    <button class="checkout" id="checkout" disabled>Finalizar compra</button>
    <button class="clear" id="clear">Esvaziar carrinho</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ===== PASSO 1: dados e vitrine ===== */
const PRODUTOS = [
  {id:1, nome:"Camiseta Oversized Preta", cat:"Camisetas", preco:89.9,  cor:"#1b1b1b", forma:"tee"},
  {id:2, nome:"Moletom Canguru Cinza",    cat:"Moletons",  preco:229.9, cor:"#7d8186", forma:"hoodie"},
  {id:3, nome:"Calça Cargo Verde",        cat:"Calças",    preco:199.9, cor:"#59673f", forma:"pants"},
  {id:4, nome:"Jaqueta Corta-Vento",      cat:"Jaquetas",  preco:329.9, cor:"#d7ff3a", forma:"hoodie"},
  {id:5, nome:"Camiseta Gráfica Branca",  cat:"Camisetas", preco:99.9,  cor:"#e9e7e1", forma:"tee"},
  {id:6, nome:"Bermuda Jeans Larga",      cat:"Bermudas",  preco:149.9, cor:"#3d5a80", forma:"shorts"},
  {id:7, nome:"Calça Jogger Preta",       cat:"Calças",    preco:179.9, cor:"#262626", forma:"pants"},
  {id:8, nome:"Boné Dad Hat Bege",        cat:"Acessórios",preco:69.9,  cor:"#c8b08a", forma:"cap"}
];

const FORMAS = {
  tee:    '<path d="M70 50 L100 40 Q150 70 200 40 L230 50 L265 95 L235 115 L220 100 L220 250 L80 250 L80 100 L65 115 L35 95 Z"/>',
  hoodie: '<path d="M65 60 L110 42 Q150 80 190 42 L235 60 L270 130 L240 145 L225 120 L225 255 L75 255 L75 120 L60 145 L30 130 Z"/><path d="M110 42 Q150 110 190 42" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="4"/>',
  pants:  '<path d="M85 40 H215 L225 260 H165 L150 120 L135 260 H75 Z"/>',
  shorts: '<path d="M80 70 H220 L235 190 H165 L150 130 L135 190 H65 Z"/>',
  cap:    '<path d="M70 170 Q70 90 150 90 Q230 90 230 170 Z"/><path d="M200 165 Q270 160 275 185 Q230 190 195 182 Z"/>'
};

// Gera uma imagem fictícia (SVG embutido) para cada produto
function imagem(p){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
    <rect width="300" height="300" fill="#d9d7d0"/>
    <circle cx="150" cy="150" r="125" fill="rgba(255,255,255,.35)"/>
    <g fill="${p.cor}" stroke="rgba(0,0,0,.3)" stroke-width="3" stroke-linejoin="round">${FORMAS[p.forma]}</g>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $ = id => document.getElementById(id);

function renderVitrine(){
  $("grid").innerHTML = PRODUTOS.map(p => `
    <article class="card">
      <img src="${imagem(p)}" alt="${p.nome}" loading="lazy">
      <div class="info">
        <span class="cat">${p.cat}</span>
        <h3>${p.nome}</h3>
        <div class="price">${brl(p.preco)}</div>
        <button class="add" data-add="${p.id}">Adicionar ao Carrinho</button>
      </div>
    </article>`).join("");
}

/* ===== PASSO 2: estado do carrinho ===== */
let carrinho = []; // [{id, qtd}]

function adicionar(id){
  const item = carrinho.find(i => i.id === id);
  item ? item.qtd++ : carrinho.push({id, qtd:1});
  atualizar(true);
  const p = PRODUTOS.find(p => p.id === id);
  toast(p.nome + " foi adicionado");
}

function alterarQtd(id, delta){
  const item = carrinho.find(i => i.id === id);
  if(!item) return;
  item.qtd += delta;
  if(item.qtd <= 0) remover(id); else atualizar();
}

function remover(id){
  carrinho = carrinho.filter(i => i.id !== id);
  atualizar();
}

const totalItens = () => carrinho.reduce((s,i) => s + i.qtd, 0);
const totalValor = () => carrinho.reduce((s,i) =>
  s + i.qtd * PRODUTOS.find(p => p.id === i.id).preco, 0);

function atualizar(animar){
  // contador do cabeçalho
  const c = $("count");
  c.textContent = totalItens();
  if(animar){ c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }

  // itens do drawer
  const box = $("items");
  if(!carrinho.length){
    box.innerHTML = '<div class="empty">Seu carrinho está vazio.<br>Escolha uma peça na vitrine.</div>';
  } else {
    box.innerHTML = carrinho.map(i => {
      const p = PRODUTOS.find(p => p.id === i.id);
      return `
      <div class="item">
        <img src="${imagem(p)}" alt="">
        <div>
          <h4>${p.nome}</h4>
          <div class="unit">${brl(p.preco)} cada</div>
          <div class="qty">
            <button data-menos="${p.id}" aria-label="Diminuir">−</button>
            <span>${i.qtd}</span>
            <button data-mais="${p.id}" aria-label="Aumentar">+</button>
          </div>
        </div>
        <div class="line-total">${brl(p.preco * i.qtd)}
          <button class="remove" data-rem="${p.id}">Remover</button>
        </div>
      </div>`;
    }).join("");
  }

  // total em tempo real
  $("total").textContent = brl(totalValor());
  $("checkout").disabled = !carrinho.length;
}

/* ===== PASSO 3: drawer lateral ===== */
function abrirCarrinho(){
  $("drawer").classList.add("open");
  $("overlay").classList.add("open");
  $("drawer").setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}
function fecharCarrinho(){
  $("drawer").classList.remove("open");
  $("overlay").classList.remove("open");
  $("drawer").setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}

let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ===== Eventos ===== */
$("openCart").addEventListener("click", abrirCarrinho);
$("closeCart").addEventListener("click", fecharCarrinho);
$("overlay").addEventListener("click", fecharCarrinho);
document.addEventListener("keydown", e => { if(e.key === "Escape") fecharCarrinho(); });

$("grid").addEventListener("click", e => {
  const b = e.target.closest("[data-add]");
  if(b) adicionar(Number(b.dataset.add));
});

$("items").addEventListener("click", e => {
  const t = e.target;
  if(t.dataset.mais)  alterarQtd(Number(t.dataset.mais), 1);
  if(t.dataset.menos) alterarQtd(Number(t.dataset.menos), -1);
  if(t.dataset.rem)   remover(Number(t.dataset.rem));
});

$("clear").addEventListener("click", () => { carrinho = []; atualizar(); });
$("checkout").addEventListener("click", () => {
  toast("Pedido de " + brl(totalValor()) + " enviado (demonstração)");
  carrinho = []; atualizar(); fecharCarrinho();
});

renderVitrine();
atualizar();
</script>
</body>
</html>
