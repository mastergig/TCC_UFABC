<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#111;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.cart-icon{
    font-size:20px;
    background:#ff9800;
    padding:10px 15px;
    border-radius:8px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:#27ae60;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
    border-radius:8px;
    transition:.3s;
}

.btn:hover{
    background:#333;
}

.cart{
    margin-top:40px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.cart h2{
    margin-bottom:20px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.remove{
    background:#e74c3c;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.total{
    margin-top:20px;
    text-align:right;
    font-size:24px;
    font-weight:bold;
    color:#27ae60;
}

footer{
    margin-top:40px;
    text-align:center;
    padding:20px;
    background:#111;
    color:white;
}

.empty-cart{
    color:#777;
}

@media(max-width:768px){
    .cart-item{
        flex-direction:column;
        gap:10px;
        align-items:flex-start;
    }
}
</style>
</head>
<body>

<header>
    <div class="logo">Fashion Store</div>

    <div class="cart-icon">
        🛒 Itens: <span id="cart-count">0</span>
    </div>
</header>

<div class="container">

    <section class="products">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="">
            <div class="card-content">
                <h3>Camiseta Básica</h3>
                <div class="price">R$ 59,90</div>
                <button class="btn"
                        onclick="adicionarCarrinho('Camiseta Básica',59.90)">
                    Adicionar ao Carrinho
                </button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500" alt="">
            <div class="card-content">
                <h3>Calça Jeans</h3>
                <div class="price">R$ 129,90</div>
                <button class="btn"
                        onclick="adicionarCarrinho('Calça Jeans',129.90)">
                    Adicionar ao Carrinho
                </button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1523398002811-999ca8dec234?w=500" alt="">
            <div class="card-content">
                <h3>Jaqueta Masculina</h3>
                <div class="price">R$ 199,90</div>
                <button class="btn"
                        onclick="adicionarCarrinho('Jaqueta Masculina',199.90)">
                    Adicionar ao Carrinho
                </button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500" alt="">
            <div class="card-content">
                <h3>Vestido Feminino</h3>
                <div class="price">R$ 149,90</div>
                <button class="btn"
                        onclick="adicionarCarrinho('Vestido Feminino',149.90)">
                    Adicionar ao Carrinho
                </button>
            </div>
        </div>

    </section>

    <section class="cart">

        <h2>Carrinho de Compras</h2>

        <div id="cart-items">
            <p class="empty-cart">Seu carrinho está vazio.</p>
        </div>

        <div class="total">
            Total: R$ <span id="total">0.00</span>
        </div>

    </section>

</div>

<footer>
    © 2026 Fashion Store - Todos os Direitos Reservados
</footer>

<script>

let carrinho = [];

function adicionarCarrinho(nome, preco){

    carrinho.push({
        nome,
        preco
    });

    atualizarCarrinho();
}

function removerItem(index){

    carrinho.splice(index,1);

    atualizarCarrinho();
}

function atualizarCarrinho(){

    const cartItems = document.getElementById("cart-items");
    const totalElement = document.getElementById("total");
    const contador = document.getElementById("cart-count");

    cartItems.innerHTML = "";

    let total = 0;

    if(carrinho.length === 0){

        cartItems.innerHTML =
        '<p class="empty-cart">Seu carrinho está vazio.</p>';

    } else {

        carrinho.forEach((item,index)=>{

            total += item.preco;

            cartItems.innerHTML += `
                <div class="cart-item">
                    <div>
                        <strong>${item.nome}</strong><br>
                        R$ ${item.preco.toFixed(2)}
                    </div>

                    <button class="remove"
                        onclick="removerItem(${index})">
                        Remover
                    </button>
                </div>
            `;
        });

    }

    totalElement.innerText = total.toFixed(2);
    contador.innerText = carrinho.length;
}

</script>

</body>
</html>
