  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ding: 12px 14px; font-size: 15px; font-weight: 500; color: #16211C; text-decoration: none\">Regiões<\u002Fa>\n        <a href=\"#newsletter\" style=\"padding: 12px 14px; font-size: 15px; font-weight: 500; color: #16211C; text-decoration: none\">Newsletter<\u002Fa>\n        <a href=\"#sobre\" style=\"padding: 12px 14px; font-size: 15px; font-weight: 500; color: #16211C; text-decoration: none\">Sobre<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section aria-labelledby=\"destaque\" style=\"max-width: 1240px; margin: 0 auto; padding: 56px 32px 64px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n    <div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px; align-items: flex-start\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n        <span style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #4B5650\">Destaque da semana<\u002Fspan>\n        <span style=\"font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: #FDE8D7; color: #9A3412\">Nordeste<\u002Fspan>\n      <\u002Fdiv>\n      <h1 id=\"destaque\" style=\"margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 800; font-size: 60px; line-height: 1.02; letter-spacing: -0.03em\">Lençóis Maranhenses: guia das dunas e lagoas<\u002Fh1>\n      <p style=\"margin: 0; font-size: 19px; line-height: 1.6; color: #3D4842; max-width: 520px\">Dunas brancas que se estendem até o mar e lagoas de água da chuva que enchem no meio do ano. Roteiro por Barreirinhas e Atins, passeios de 4x4 e a melhor época para encontrar as lagoas cheias.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n        <button type=\"button\" style=\"font: inherit; font-size: 16px; font-weight: 600; padding: 14px 26px; border-radius: 999px; border: 0; background: {{accent}}; color: #FFFFFF; cursor: pointer\">Ler Guia<\u002Fbutton>\n        <span style=\"font-size: 14px; color: #4B5650\">Maranhão · 12 min de leitura<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 460px; min-width: 0; aspect-ratio: 5 / 4; border-radius: 20px; background: #FDE8D7; color: #9A3412; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px\">\n      <svg aria-hidden=\"true\" width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 16l5-5 4 4 3-3 6 6\"><\u002Fpath><circle cx=\"16\" cy=\"8.5\" r=\"1.5\"><\u002Fcircle><\u002Fsvg>\n      <span style=\"font-size: 14px; font-weight: 500\">Foto · Lençóis Maranhenses<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"regioes\" aria-labelledby=\"regioes-titulo\" style=\"background: #F1EFE8; border-top: 1px solid #E4E2DA; border-bottom: 1px solid #E4E2DA\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px\">\n        <h2 id=\"regioes-titulo\" style=\"margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em\">Explore por região<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; color: #4B5650\">Escolha uma região para filtrar os guias<\u002Fp>\n      <\u002Fdiv>\n      <div role=\"group\" aria-label=\"Filtrar por região\" style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n        <sc-for list=\"{{regions}}\" as=\"r\" hint-placeholder-count=\"6\">\n          <button type=\"button\" aria-pressed=\"{{r.pressed}}\" sc-camel-on-click=\"{{r.pick}}\" style=\"{{r.btnStyle}}\">\n            <span style=\"font-weight: 600; font-size: 16px\">{{r.name}}<\u002Fspan>\n            <span style=\"font-size: 13px; opacity: 0.85\">{{r.count}}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"guias\" aria-labelledby=\"guias-titulo\" style=\"max-width: 1240px; margin: 0 auto; padding: 56px 32px 72px; display: flex; flex-direction: column; gap: 28px\">\n    <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px\">\n      <h2 id=\"guias-titulo\" style=\"margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em\">{{gridTitle}}<\u002Fh2>\n      <p style=\"margin: 0; font-size: 15px; color: #4B5650\">{{gridCount}}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px\">\n      <sc-for list=\"{{posts}}\" as=\"p\" hint-placeholder-count=\"6\">\n        <article style=\"background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column\">\n          <div style=\"aspect-ratio: 4 / 3; background: {{p.bg}}; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px\">\n            <svg aria-hidden=\"true\" width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 16l5-5 4 4 3-3 6 6\"><\u002Fpath><circle cx=\"16\" cy=\"8.5\" r=\"1.5\"><\u002Fcircle><\u002Fsvg>\n            <span style=\"font-size: 13px; font-weight: 500\">Foto · {{p.place}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; align-items: flex-start\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n              <span style=\"font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}\">{{p.region}}<\u002Fspan>\n              <span style=\"font-size: 13px; color: #4B5650\">{{p.meta}}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em\">{{p.title}}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3D4842; flex-grow: 1\">{{p.summary}}<\u002Fp>\n            <button type=\"button\" style=\"font: inherit; font-size: 15px; font-weight: 600; margin-top: 6px; padding: 12px 22px; border-radius: 999px; border: 1.5px solid {{accent}}; background: transparent; color: {{accent}}; cursor: pointer\">Ler Guia<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"newsletter\" aria-labelledby=\"news-titulo\" style=\"padding: 0 32px 72px\">\n    <div style=\"max-width: 1176px; margin: 0 auto; background: #0F2A21; color: #F3F1EA; border-radius: 24px; padding: 48px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between\">\n      <div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n        <h2 id=\"news-titulo\" style=\"margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em\">Um destino novo toda semana<\u002Fh2>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3CD\">Receba o guia mais recente, a melhor época de cada lugar e roteiros prontos por região.<\u002Fp>\n      <\u002Fdiv>\n      <form style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n        <label for=\"email\" style=\"font-size: 14px; font-weight: 500; color: #C9D3CD\">Seu e-mail<\u002Flabel>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n          <input id=\"email\" type=\"email\" placeholder=\"nome@exemplo.com\" style=\"flex: 1 1 220px; min-width: 0; font: inherit; font-size: 16px; padding: 14px 18px; border-radius: 999px; border: 1px solid #3E5A4F; background: #16362B; color: #F3F1EA\">\n          <button type=\"button\" style=\"font: inherit; font-size: 16px; font-weight: 600; padding: 14px 26px; border-radius: 999px; border: 0; background: #F3F1EA; color: #0F2A21; cursor: pointer\">Inscrever<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer id=\"sobre\" style=\"border-top: 1px solid #E4E2DA\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 40px 32px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px\">\n      <div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px; max-width: 420px\">\n        <span style=\"font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 800; font-size: 22px\">Rota Brasil<\u002Fspan>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #4B5650\">Guias de viagem pelos pontos turísticos do Brasil, organizados pelas cinco regiões do país.<\u002Fp>\n      <\u002Fdiv>\n      <nav aria-label=\"Regiões\" style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px\">\n        <span style=\"font-weight: 600\">Regiões<\u002Fspan>\n        <a href=\"#regioes\">Norte<\u002Fa>\n        <a href=\"#regioes\">Nordeste<\u002Fa>\n        <a href=\"#regioes\">Centro-Oeste<\u002Fa>\n        <a href=\"#regioes\">Sudeste<\u002Fa>\n        <a href=\"#regioes\">Sul<\u002Fa>\n      <\u002Fnav>\n      <nav aria-label=\"Blog\" style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px\">\n        <span style=\"font-weight: 600\">Blog<\u002Fspan>\n        <a href=\"#guias\">Todos os guias<\u002Fa>\n        <a href=\"#newsletter\">Newsletter<\u002Fa>\n        <a href=\"#sobre\">Contato<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0E5E46&quot;,&quot;options&quot;:[&quot;#0E5E46&quot;,&quot;#1E3A8A&quot;,&quot;#9A3412&quot;,&quot;#16211C&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3400}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { region: 'Todas' };\n  }\n  renderVals() {\n    var accent = this.props.accent ?? '#0E5E46';\n    var COLORS = {\n      'Norte': { fg: '#14532D', bg: '#DCEFE3' },\n      'Nordeste': { fg: '#9A3412', bg: '#FDE8D7' },\n      'Centro-Oeste': { fg: '#713F12', bg: '#F6EBC8' },\n      'Sudeste': { fg: '#1E3A8A', bg: '#DDE7F7' },\n      'Sul': { fg: '#581C87', bg: '#ECE1F5' }\n    };\n    var ALL = [\n      { region: 'Nordeste', place: 'Lençóis Maranhenses', meta: 'MA · 12 min', title: 'Lençóis Maranhenses: guia das dunas e lagoas', summary: 'Dunas brancas e lagoas de água da chuva que enchem no meio do ano. Roteiro por Barreirinhas e Atins, com passeios de 4x4 e a melhor época para ver as lagoas cheias.' },\n      { region: 'Sudeste', place: 'Paraty', meta: 'RJ · 10 min', title: 'Paraty e a Costa Verde: história, ilhas e praias', summary: 'Centro histórico de pedra, passeios de escuna pelas ilhas da baía e as praias de Trindade. Como montar o roteiro de Angra dos Reis a Paraty.' },\n      { region: 'Norte', place: 'Alter do Chão', meta: 'PA · 8 min', title: 'Alter do Chão: praias de rio no Tapajós', summary: 'Faixas de areia branca que surgem na seca do Rio Tapajós e a Ilha do Amor bem em frente à vila. Quando ir e como chegar a partir de Santarém.' },\n      { region: 'Centro-Oeste', place: 'Bonito', meta: 'MS · 9 min', title: 'Bonito: flutuação em rios cristalinos', summary: 'Flutuação em rios de água transparente, a Gruta do Lago Azul e o Buraco das Araras. Os passeios têm vagas limitadas e são vendidos por agências credenciadas.' },\n      { region: 'Sul', place: 'Foz do Iguaçu', meta: 'PR · 9 min', title: 'Foz do Iguaçu: as Cataratas dos dois lados', summary: 'As passarelas do lado brasileiro, a Garganta do Diabo pelo lado argentino e a visita à usina de Itaipu em um roteiro de três dias.' },\n      { region: 'Nordeste', place: 'Chapada Diamantina', meta: 'BA · 11 min', title: 'Chapada Diamantina: trilhas, poços e cachoeiras', summary: 'Cachoeira da Fumaça, Vale do Pati e Poço Azul, com base na cidade de Lençóis. Níveis de dificuldade e quando contratar guia local.' },\n      { region: 'Norte', place: 'Manaus', meta: 'AM · 8 min', title: 'Manaus e o Encontro das Águas', summary: 'O Teatro Amazonas, o encontro dos rios Negro e Solimões e como escolher um hotel de selva para passar alguns dias na floresta.' },\n      { region: 'Centro-Oeste', place: 'Chapada dos Veadeiros', meta: 'GO · 10 min', title: 'Chapada dos Veadeiros: cachoeiras no Cerrado', summary: 'Cânions, os saltos do Rio Preto e o Vale da Lua, saindo de Alto Paraíso de Goiás ou da vila de São Jorge.' },\n      { region: 'Sudeste', place: 'Ouro Preto', meta: 'MG · 9 min', title: 'Ouro Preto e as cidades históricas de Minas', summary: 'Igrejas barrocas, obras de Aleijadinho e ladeiras coloniais, com esticadas até Mariana e Tiradentes.' },\n      { region: 'Nordeste', place: 'Fernando de Noronha', meta: 'PE · 12 min', title: 'Fernando de Noronha sem mistério', summary: 'Baía do Sancho, mergulho com tartarugas e golfinhos-rotadores. O que saber sobre a taxa de preservação e o ingresso do parque nacional.' },\n      { region: 'Centro-Oeste', place: 'Pantanal', meta: 'MT · 11 min', title: 'Pantanal: guia de observação de fauna', summary: 'Safári fotográfico pela Transpantaneira para ver onças-pintadas, tuiuiús e jacarés. Por que a estação seca facilita a observação.' },\n      { region: 'Sul', place: 'Cânion Itaimbezinho', meta: 'RS · 8 min', title: 'Cânions do Sul: Itaimbezinho e Fortaleza', summary: 'Trilhas pela borda e pelo leito dos cânions a partir de Cambará do Sul, nos Aparados da Serra.' }\n    ];\n    var self = this;\n    var current = this.state.region;\n    var names = ['Todas', 'Norte', 'Nordeste', 'Centro-Oeste', 'Sudeste', 'Sul'];\n    var regions = names.map(function (n) {\n      var c = n === 'Todas' ? ALL.length : ALL.filter(function (p) { return p.region === n; }).length;\n      var on = n === current;\n      var col = COLORS[n] || { fg: '#16211C', bg: '#FFFFFF' };\n      var style = 'font: inherit; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 150px; min-height: 44px; padding: 14px 20px; border-radius: 14px; cursor: pointer; text-align: left; ' +\n        (on ? 'background: ' + (n === 'Todas' ? accent : col.fg) + '; color: #FFFFFF; border: 1.5px solid transparent;'\n            : 'background: #FFFFFF; color: ' + col.fg + '; border: 1.5px solid #DDDAD0;');\n      return {\n        name: n,\n        count: c + (c === 1 ? ' guia' : ' guias'),\n        pressed: on ? 'true' : 'false',\n        btnStyle: style,\n        pick: function () { self.setState({ region: n }); }\n      };\n    });\n    var posts = ALL.filter(function (p) { return current === 'Todas' || p.region === current; })\n      .map(function (p) { return Object.assign({}, p, COLORS[p.region]); });\n    return {\n      accent: accent,\n      regions: regions,\n      posts: posts,\n      gridTitle: current === 'Todas' ? 'Guias recentes' : 'Guias do ' + current,\n      gridCount: 'Mostrando ' + posts.length + (posts.length === 1 ? ' guia' : ' guias')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
