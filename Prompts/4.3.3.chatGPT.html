
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBAN STORE | Moda Urbana</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #171717;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 25px;
            letter-spacing: 3px;
        }

        .cart-button {
            background: #e6a23c;
            color: #171717;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .banner {
            background: linear-gradient(90deg, #171717, #444);
            color: white;
            text-align: center;
            padding: 75px 20px;
        }

        .banner h2 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .banner p {
            color: #ddd;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 45px auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
            font-size: 28px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px #00000012;
            transition: transform .3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
            text-align: center;
        }

        .product-info h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #b7791f;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 15px;
        }

        button {
            cursor: pointer;
        }

        .add-button {
            background: #171717;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
        }

        .add-button:hover {
            background: #b7791f;
        }

        /* Carrinho */

        .cart-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-top: 50px;
            box-shadow: 0 3px 12px #00000012;
        }

        .cart-section h2 {
            margin-bottom: 25px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h4 {
            margin-bottom: 7px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .quantity-controls button {
            width: 28px;
            height: 28px;
            border: none;
            background: #eee;
            border-radius: 4px;
            font-weight: bold;
        }

        .remove-button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 5px;
        }

        .cart-total {
            text-align: right;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .empty-cart {
            color: #888;
            text-align: center;
            padding: 25px;
        }

        .checkout-button {
            background: #198754;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            background: #171717;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        @media(max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            header h1 {
                font-size: 19px;
            }

            .banner h2 {
                font-size: 28px;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-total {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>URBAN STORE</h1>
        <button class="cart-button" onclick="scrollToCart()">
            🛒 Carrinho (<span id="cart-count">0</span>)
        </button>
    </header>

    <section class="banner">
        <h2>ESTILO QUE DEFINE VOCÊ</h2>
        <p>Descubra nossa coleção exclusiva de moda urbana.</p>
    </section>

    <main class="container">

        <h2 class="section-title">Nossa Coleção</h2>

        <section class="products" id="products">

            <!-- Produtos renderizados pelo JavaScript -->

        </section>

        <section class="cart-section" id="cart">
            <h2>🛒 Meu Carrinho</h2>

            <div id="cart-items">
                <p class="empty-cart">Seu carrinho está vazio.</p>
            </div>

            <div class="cart-total">
                Total: R$ <span id="cart-total">0,00</span>
            </div>

            <button class="checkout-button" onclick="checkout()">
                Finalizar compra
            </button>
        </section>

    </main>

    <footer>
        <p>© 2026 URBAN STORE - Todos os direitos reservados.</p>
    </footer>

    <script>
        // Catálogo de produtos
        const products = [
            {
                id: 1,
                name: "Camiseta Oversized",
                price: 89.90,
                image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"
            },
            {
                id: 2,
                name: "Jaqueta Jeans",
                price: 189.90,
                image: "https://images.unsplash.com/photo-1543076447-215ad9ba6923?w=600"
            },
            {
                id: 3,
                name: "Moletom Urban",
                price: 149.90,
                image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600"
            },
            {
                id: 4,
                name: "Calça Cargo",
                price: 129.90,
                image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600"
            },
            {
                id: 5,
                name: "Camiseta Básica",
                price: 59.90,
                image: "https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=600"
            },
            {
                id: 6,
                name: "Jaqueta Casual",
                price: 219.90,
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600"
            }
        ];

        // Recupera o carrinho salvo
        let cart = JSON.parse(localStorage.getItem("urbanCart")) || [];

        // Formatação monetária
        function formatPrice(value) {
            return value.toLocaleString("pt-BR", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Exibe os produtos
        function renderProducts() {
            const container = document.getElementById("products");

            container.innerHTML = products.map(product => `
                <article class="product">
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        loading="lazy"
                    >

                    <div class="product-info">
                        <h3>${product.name}</h3>

                        <p class="price">
                            R$ ${formatPrice(product.price)}
                        </p>

                        <button
                            class="add-button"
                            onclick="addToCart(${product.id})"
                        >
                            Adicionar ao carrinho
                        </button>
                    </div>
                </article>
            `).join("");
        }

        // Adiciona produto ao carrinho
        function addToCart(id) {
            const product = products.find(item => item.id === id);

            if (!product) return;

            const existingItem = cart.find(item => item.id === id);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }

            updateCart();

            alert(product.name + " adicionado ao carrinho!");
        }

        // Altera a quantidade de um produto
        function changeQuantity(id, amount) {
            const item = cart.find(product => product.id === id);

            if (!item) return;

            item.quantity += amount;

            if (item.quantity <= 0) {
                removeFromCart(id);
                return;
            }

            updateCart();
        }

        // Remove produto do carrinho
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCart();
        }

        // Atualiza o carrinho
        function updateCart() {
            const container = document.getElementById("cart-items");
            const count = document.getElementById("cart-count");
            const totalElement = document.getElementById("cart-total");

            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                container.innerHTML = `
                    <p class="empty-cart">
                        Seu carrinho está vazio.
                    </p>
                `;
            } else {
                container.innerHTML = cart.map(item => {
                    const subtotal = item.price * item.quantity;

                    total += subtotal;
                    totalItems += item.quantity;

                    return `
                        <div class="cart-item">

                            <div class="cart-item-info">
                                <h4>${item.name}</h4>

                                <p>
                                    R$ ${formatPrice(item.price)}
                                    por unidade
                                </p>

                                <div class="quantity-controls">
                                    <button
                                        onclick="changeQuantity(${item.id}, -1)"
                                        aria-label="Diminuir quantidade"
                                    >−</button>

                                    <span>${item.quantity}</span>

                                    <button
                                        onclick="changeQuantity(${item.id}, 1)"
                                        aria-label="Aumentar quantidade"
                                    >+</button>
                                </div>
                            </div>

                            <strong>
                                R$ ${formatPrice(subtotal)}
                            </strong>

                            <button
                                class="remove-button"
                                onclick="removeFromCart(${item.id})"
                            >
                                Remover
                            </button>

                        </div>
                    `;
                }).join("");
            }

            // Atualiza quantidade e valores
            count.textContent = totalItems;
            totalElement.textContent = formatPrice(total);

            // Salva o carrinho no navegador
            localStorage.setItem("urbanCart", JSON.stringify(cart));
        }

        // Rola até o carrinho
        function scrollToCart() {
            document.getElementById("cart").scrollIntoView({
                behavior: "smooth"
            });
        }

        // Finalização demonstrativa
        function checkout() {
            if (cart.length === 0) {
                alert("Adicione produtos ao carrinho primeiro!");
                return;
            }

            const total = cart.reduce(
                (sum, item) => sum + item.price * item.quantity,
                0
            );

            alert(
                "Pedido realizado com sucesso!\n" +
                "Total: R$ " + formatPrice(total) +
                "\n\nEsta é uma demonstração. Nenhum pagamento foi realizado."
            );

            cart = [];
            updateCart();
        }

        // Inicialização
        renderProducts();
        updateCart();

    </script>

</body>
</html>
