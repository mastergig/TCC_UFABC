<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja de Roupas</title>

<link rel="stylesheet" href="4.3.4.Copilot.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<header>
    <div class="logo">
        Fashion Store
    </div>

    <div class="cart-icon" id="openCart">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
    </div>
</header>

<main>

    <section class="products">

        <div class="product">
            <img src="https://via.placeholder.com/300x350" alt="Produto">
            <h3>Camiseta Premium</h3>
            <p>R$ 79,90</p>
            <button onclick="addToCart(1,'Camiseta Premium',79.90)">
                Adicionar ao Carrinho
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x350" alt="Produto">
            <h3>Jaqueta Jeans</h3>
            <p>R$ 199,90</p>
            <button onclick="addToCart(2,'Jaqueta Jeans',199.90)">
                Adicionar ao Carrinho
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x350" alt="Produto">
            <h3>Calça Slim</h3>
            <p>R$ 129,90</p>
            <button onclick="addToCart(3,'Calça Slim',129.90)">
                Adicionar ao Carrinho
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x350" alt="Produto">
            <h3>Moletom Casual</h3>
            <p>R$ 149,90</p>
            <button onclick="addToCart(4,'Moletom Casual',149.90)">
                Adicionar ao Carrinho
            </button>
        </div>

    </section>

</main>

<!-- Drawer -->

<div class="cart-drawer" id="cartDrawer">

    <div class="cart-header">
        <h2>Meu Carrinho</h2>

        <button id="closeCart">
            ✖
        </button>
    </div>

    <div id="cart-items"></div>

    <div class="cart-footer">
        <h3>
            Total: R$
            <span id="cart-total">0.00</span>
        </h3>
    </div>

</div>

<script src="4.3.4.Copilot.js"></script>

</body>
</html>
