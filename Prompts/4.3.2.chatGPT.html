
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREETWEAR | Moda Urbana</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #171717;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .cart-button {
            background: #e6ff00;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        .hero {
            background: linear-gradient(90deg, #111, #444);
            color: white;
            padding: 85px 7%;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(35px, 6vw, 65px);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero p {
            color: #ddd;
            font-size: 18px;
        }

        .products-section {
            padding: 60px 7%;
        }

        .section-title {
            font-size: 30px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            transition: transform .3s;
            box-shadow: 0 4px 12px #00000012;
        }

        .product:hover {
            transform: translateY(-6px);
        }

        .product img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 21px;
            font-weight: bold;
            margin: 15px 0;
        }

        .add-button {
            width: 100%;
            background: #111;
            color: white;
            padding: 13px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .add-button:hover {
            background: #444;
        }

        /* Fundo do carrinho */
        .overlay {
            position: fixed;
            inset: 0;
            background: #0009;
            z-index: 19;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Carrinho lateral */
        .cart {
            position: fixed;
            top: 0;
            right: -450px;
            width: 420px;
            max-width: 100%;
            height: 100vh;
            background: white;
            z-index: 20;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: right .3s;
        }

        .cart.active {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .close-cart {
            border: none;
            background: none;
            font-size: 28px;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 85px;
            height: 95px;
            object-fit: cover;
            border-radius: 5px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h4 {
            margin-bottom: 8px;
        }

        .item-price {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 27px;
            height: 27px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
        }

        .remove {
            color: #d22;
            border: none;
            background: none;
            cursor: pointer;
            margin-top: 8px;
        }

        .cart-footer {
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .checkout {
            width: 100%;
            padding: 16px;
            background: #e6ff00;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 60px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media(max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 20px;
            }

            .hero {
                padding: 65px 5%;
            }

            .products-section {
                padding: 40px 5%;
            }

            .cart {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">STREETWEAR.</div>

    <button class="cart-button" onclick="openCart()">
        🛒 Carrinho (<span id="cart-count">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Vista sua atitude.</h1>
    <p>Moda urbana para quem não segue tendências. Cria seu próprio estilo.</p>
</section>

<main class="products-section">
    <h2 class="section-title">Nossa coleção</h2>

    <div class="products" id="products"></div>
</main>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<aside class="cart" id="cart">

    <div class="cart-header">
        <h2>Meu Carrinho</h2>
        <button class="close-cart" onclick="closeCart()">×</button>
    </div>

    <div class="cart-items" id="cart-items"></div>

    <div class="cart-footer">
        <div class="total">
            <span>Total:</span>
            <span id="cart-total">R$ 0,00</span>
        </div>

        <button class="checkout" onclick="checkout()">
            FINALIZAR COMPRA
        </button>
    </div>

</aside>

<footer>
    <p>© 2026 STREETWEAR. Todos os direitos reservados.</p>
    <p>Moda urbana. Autenticidade em cada detalhe.</p>
</footer>

<script>
    // Catálogo de produtos
    const products = [
        {
            id: 1,
            name: "Camiseta Oversized",
            category: "Camisetas",
            price: 89.90,
            image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600"
        },
        {
            id: 2,
            name: "Moletom Street",
            category: "Moletons",
            price: 179.90,
            image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600"
        },
        {
            id: 3,
            name: "Jaqueta Urbana",
            category: "Jaquetas",
            price: 249.90,
            image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600"
        },
        {
            id: 4,
            name: "Calça Cargo",
            category: "Calças",
            price: 159.90,
            image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600"
        },
        {
            id: 5,
            name: "Tênis Casual",
            category: "Calçados",
            price: 299.90,
            image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
        },
        {
            id: 6,
            name: "Camiseta Basic",
            category: "Camisetas",
            price: 69.90,
            image: "https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=600"
        }
    ];

    // Recupera o carrinho salvo
    let cart = JSON.parse(localStorage.getItem("streetwear-cart")) || [];

    const formatPrice = value =>
        value.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

    // Exibe os produtos
    function renderProducts() {
        const container = document.getElementById("products");

        container.innerHTML = products.map(product => `
            <article class="product">
                <img src="${product.image}" alt="${product.name}">
                <div class="product-info">
                    <h3>${product.name}</h3>
                    <p>${product.category}</p>
                    <div class="price">
                        ${formatPrice(product.price)}
                    </div>
                    <button class="add-button"
                        onclick="addToCart(${product.id})">
                        ADICIONAR AO CARRINHO
                    </button>
                </div>
            </article>
        `).join("");
    }

    // Adiciona produto
    function addToCart(id) {
        const product = products.find(item => item.id === id);

        const existing = cart.find(item => item.id === id);

        if (existing) {
            existing.quantity++;
        } else {
            cart.push({
                ...product,
                quantity: 1
            });
        }

        updateCart();
    }

    // Altera quantidade
    function changeQuantity(id, amount) {
        const item = cart.find(item => item.id === id);

        if (!item) return;

        item.quantity += amount;

        if (item.quantity <= 0) {
            removeItem(id);
            return;
        }

        updateCart();
    }

    // Remove produto
    function removeItem(id) {
        cart = cart.filter(item => item.id !== id);
        updateCart();
    }

    // Atualiza o carrinho e os valores
    function updateCart() {
        const container = document.getElementById("cart-items");

        const totalItems = cart.reduce(
            (sum, item) => sum + item.quantity, 0
        );

        const total = cart.reduce(
            (sum, item) => sum + item.price * item.quantity, 0
        );

        document.getElementById("cart-count").textContent = totalItems;

        document.getElementById("cart-total").textContent =
            formatPrice(total);

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <h3>Seu carrinho está vazio!</h3>
                    <p>Adicione produtos para começar.</p>
                </div>
            `;
        } else {
            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">

                    <div class="item-info">
                        <h4>${item.name}</h4>

                        <div class="item-price">
                            ${formatPrice(item.price * item.quantity)}
                        </div>

                        <div class="quantity">
                            <button onclick="changeQuantity(${item.id}, -1)">
                                -
                            </button>

                            <span>${item.quantity}</span>

                            <button onclick="changeQuantity(${item.id}, 1)">
                                +
                            </button>
                        </div>

                        <button class="remove"
                            onclick="removeItem(${item.id})">
                            Remover
                        </button>
                    </div>
                </div>
            `).join("");
        }

        // Salva o carrinho no navegador
        localStorage.setItem(
            "streetwear-cart",
            JSON.stringify(cart)
        );
    }

    // Abre o carrinho
    function openCart() {
        document.getElementById("cart").classList.add("active");
        document.getElementById("overlay").classList.add("active");
    }

    // Fecha o carrinho
    function closeCart() {
        document.getElementById("cart").classList.remove("active");
        document.getElementById("overlay").classList.remove("active");
    }

    // Finalização demonstrativa
    function checkout() {
        if (cart.length === 0) {
            alert("Seu carrinho está vazio!");
            return;
        }

        const total = cart.reduce(
            (sum, item) => sum + item.price * item.quantity, 0
        );

        alert(
            "Pedido realizado com sucesso!\n" +
            "Total: " + formatPrice(total) +
            "\n\nEsta é uma demonstração. Nenhum pagamento foi processado."
        );

        cart = [];
        updateCart();
        closeCart();
    }

    // Inicialização
    renderProducts();
    updateCart();
</script>

</body>
</html>
