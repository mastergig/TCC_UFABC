<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#111;color:#fff;padding:20px;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center}
.container{max-width:1200px;margin:auto;padding:30px 20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card img{width:100%;height:280px;object-fit:cover}
.card-content{padding:15px}
.card h3{margin-bottom:10px}
.price{color:#0a8f3d;font-size:22px;font-weight:bold}
button{background:#111;color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer}
button:hover{opacity:.9}
#cart{background:#fff;padding:20px;border-radius:15px;margin-top:40px}
.cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd}
.total{margin-top:20px;font-size:24px;font-weight:bold}
.remove{background:#dc2626}
.checkout{background:#16a34a;margin-top:15px}
</style>
</head>
<body>
<header>
<h1>Fashion Store</h1>
<h3>Carrinho: <span id="cartCount">0</span></h3>
</header>
<div class="container">
<h2>Produtos em Destaque</h2>
<br>
<div class="products" id="products"></div>
<div id="cart">
<h2>Meu Carrinho</h2>
<div id="cartItems"></div>
<div class="total">Total: R$ <span id="total">0.00</span></div>
<button class="checkout">Finalizar Compra</button>
</div>
</div>
<script>
const produtos = [
{id:1,nome:'Camiseta Premium',preco:79.90,imagem:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500'},
{id:2,nome:'Jaqueta Jeans',preco:199.90,imagem:'https://images.unsplash.com/photo-1512436991641-6745cdb1723?w=500'},
{id:3,nome:'Calça Slim',preco:129.90,imagem:'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500'},
{id:4,nome:'Moletom Casual',preco:149.90,imagem:'https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=500'}
];
let carrinho = [];
function renderProdutos(){
const container = document.getElementById('products');
container.innerHTML = produtos.map(produto => `
<div class="card">
<img src="${produto.imagem}" alt="${produto.nome}">
<div class="card-content">
<h3>${produto.nome}</h3>
<p class="price">R$ ${produto.preco.toFixed(2)}</p>
<br>
<button onclick="adicionarCarrinho(${produto.id})">Adicionar ao Carrinho</button>
</div>
</div>`).join('');
}
function adicionarCarrinho(id){
const produto = produtos.find(p => p.id === id);
const item = carrinho.find(i => i.id === id);
if(item){
item.quantidade++;
}else{
carrinho.push({...produto, quantidade:1});
}
renderCarrinho();
}
function removerItem(id){
carrinho = carrinho.filter(item => item.id !== id);
renderCarrinho();
}
function renderCarrinho(){
const cartItems = document.getElementById('cartItems');
const totalEl = document.getElementById('total');
const countEl = document.getElementById('cartCount');
countEl.textContent = carrinho.reduce((t,i)=>t+i.quantidade,0);
cartItems.innerHTML = carrinho.length ? carrinho.map(item => `
<div class="cart-item">
<div>
<strong>${item.nome}</strong><br>
Qtd: ${item.quantidade}
</div>
<div>
R$ ${(item.preco*item.quantidade).toFixed(2)}
<button class="remove" onclick="removerItem(${item.id})">Remover</button>
</div>
</div>`).join('') : '<p>Nenhum produto adicionado.</p>';
const total = carrinho.reduce((acc,item)=>acc+(item.preco*item.quantidade),0);
totalEl.textContent = total.toFixed(2);
}

renderProdutos();
renderCarrinho();
</script>
</body>
</html>
