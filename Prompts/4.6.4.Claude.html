<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinema — Agendamento de Ingressos</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--text:#eef1f6;--muted:#9aa3b2;--accent:#f59e0b;--danger:#f87171;--ok:#34d399}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
header{padding:28px 20px 12px;max-width:1200px;margin:0 auto}
header h1{margin:0 0 4px;font-size:28px}
header p{margin:0;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:12px 20px 60px}
#catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.film{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.poster{position:relative;height:300px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden}
.poster .orb{position:absolute;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.25);top:-60px;right:-60px}
.poster .orb.b{width:140px;height:140px;top:auto;bottom:-40px;left:-40px;right:auto;background:rgba(255,255,255,.08)}
.poster .genre{position:absolute;top:14px;left:14px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:6px}
.poster h2{margin:0;font-size:26px;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.4);position:relative}
.poster .dur{font-size:13px;opacity:.85;position:relative;margin-top:4px}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.room-row strong{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.times{display:flex;flex-wrap:wrap;gap:8px}
.time{background:transparent;color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.time:hover:not(:disabled){background:var(--accent);color:#111}
.time:disabled{border-color:var(--line);color:#5b6372;text-decoration:line-through;cursor:not-allowed}
.time:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.backdrop[hidden]{display:none}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;padding:24px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:20px}
.modal .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
dl.summary{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 18px;padding:14px;background:#11141a;border:1px solid var(--line);border-radius:10px}
dl.summary dt{color:var(--muted);font-size:14px}
dl.summary dd{margin:0;text-align:right;font-weight:600}
dl.summary .total{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;font-size:18px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0f1115;color:var(--text);font:inherit}
input[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;min-height:0;margin-top:4px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#111}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.success{text-align:center;padding:10px 0}
.success .code{font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--ok);margin:10px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Cinema</h1>
  <p>Escolha um filme e um horário para reservar seus ingressos.</p>
</header>
<main>
  <section id="catalog" aria-label="Filmes em cartaz"></section>
</main>

<!-- Modal 1: quantidade de ingressos -->
<div id="qty-modal" class="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="qty-title">
    <h3 id="qty-title">Quantos ingressos?</h3>
    <p class="sub" id="qty-sub"></p>
    <label>Quantidade
      <select id="qty"></select>
    </label>
    <dl class="summary">
      <dt>Preço unitário</dt><dd id="qty-unit"></dd>
      <dt class="total">Total</dt><dd class="total" id="qty-total"></dd>
    </dl>
    <div class="actions">
      <button class="btn ghost" data-close>Cancelar</button>
      <button class="btn" id="qty-next">Continuar</button>
    </div>
  </div>
</div>

<!-- Modal 2: confirmação e dados do cliente -->
<div id="order-modal" class="backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="order-title">
    <div id="order-form-view">
      <h3 id="order-title">Confirme seu agendamento</h3>
      <dl class="summary" id="order-summary"></dl>
      <form id="customer-form" novalidate>
        <label>Nome completo
          <input id="nome" name="nome" autocomplete="name" required>
          <div class="err" id="nome-err"></div>
        </label>
        <label>E-mail
          <input id="email" type="email" name="email" autocomplete="email" required>
          <div class="err" id="email-err"></div>
        </label>
        <div class="actions">
          <button type="button" class="btn ghost" data-close>Voltar</button>
          <button type="submit" class="btn">Confirmar agendamento</button>
        </div>
      </form>
    </div>
    <div id="order-success-view" class="success" hidden>
      <h3>Agendamento realizado!</h3>
      <p class="sub">Código da reserva:</p>
      <div class="code" id="success-code"></div>
      <p class="sub" id="success-text"></p>
      <div class="actions" style="justify-content:center">
        <button class="btn" data-close>Fechar</button>
      </div>
    </div>
    <p class="note">Demonstração: nenhum pagamento é cobrado e nenhum e-mail é enviado.</p>
  </div>
</div>

<script>
const films = [
  {id:'lua',   title:'Lua de Vidro',    genre:'Ficção científica', dur:'118 min', from:'#1e3a8a', to:'#7c3aed',
   sched:[{room:'Sala 1', times:['14:00','17:20','20:40']}, {room:'Sala 2', times:['15:30','19:10','22:30']}]},
  {id:'farol', title:'O Último Farol',  genre:'Drama',            dur:'104 min', from:'#065f46', to:'#d97706',
   sched:[{room:'Sala 1', times:['13:45','16:30','21:00']}, {room:'Sala 3', times:['18:00','20:30']}]},
  {id:'rota',  title:'Rota Noturna',    genre:'Ação',             dur:'126 min', from:'#7f1d1d', to:'#111827',
   sched:[{room:'Sala 2', times:['16:00','19:40','23:00']}, {room:'Sala 3', times:['21:15']}]},
  {id:'papel', title:'Jardim de Papel', genre:'Animação',         dur:'92 min',  from:'#be185d', to:'#f59e0b',
   sched:[{room:'Sala 1', times:['12:30','15:00','17:30']}, {room:'Sala 2', times:['14:20','18:50']}]}
];
const rooms = {
  'Sala 1': {tipo:'2D',  price:28},
  'Sala 2': {tipo:'3D',  price:36},
  'Sala 3': {tipo:'VIP', price:52}
};
// Sessões esgotadas (simulação de disponibilidade)
const soldOut = new Set(['lua|Sala 2|22:30', 'rota|Sala 2|23:00']);

const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const $ = id => document.getElementById(id);
let sel = null; // {filmId, room, time, qty}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

/* ---------- Passo 1: catálogo ---------- */
function renderCatalog(){
  const grid = $('catalog');
  films.forEach(f => {
    const art = el('article','film');

    const poster = el('div','poster');
    poster.style.background = `linear-gradient(160deg, ${f.from}, ${f.to})`;
    poster.setAttribute('role','img');
    poster.setAttribute('aria-label', `Cartaz ilustrativo de ${f.title}`);
    poster.append(el('span','orb'), el('span','orb b'),
                  el('span','genre', f.genre), el('h2', null, f.title), el('span','dur', f.dur));

    const body = el('div','body');
    f.sched.forEach(s => {
      const row = el('div','room-row');
      const r = rooms[s.room];
      row.append(el('strong', null, `${s.room} · ${r.tipo}`));
      const times = el('div','times');
      s.times.forEach(t => {
        const b = el('button','time', t);
        b.type = 'button';
        b.dataset.f = f.id; b.dataset.r = s.room; b.dataset.t = t;
        if(soldOut.has(`${f.id}|${s.room}|${t}`)){
          b.disabled = true; b.title = 'Esgotado';
        }
        times.append(b);
      });
      row.append(times);
      body.append(row);
    });

    art.append(poster, body);
    grid.append(art);
  });

  grid.addEventListener('click', e => {
    const b = e.target.closest('.time');
    if(!b || b.disabled) return;
    sel = {filmId: b.dataset.f, room: b.dataset.r, time: b.dataset.t, qty: 1};
    openQty();
  });
}

/* ---------- Passo 2: quantidade de ingressos ---------- */
function currentFilm(){ return films.find(f => f.id === sel.filmId); }

function openQty(){
  const f = currentFilm(), r = rooms[sel.room];
  $('qty-sub').textContent = `${f.title} · ${sel.room} (${r.tipo}) · ${sel.time}`;
  $('qty-unit').textContent = brl(r.price);
  const qty = $('qty');
  qty.innerHTML = '';
  for(let i = 1; i <= 8; i++){
    const o = el('option', null, i === 1 ? '1 ingresso' : `${i} ingressos`);
    o.value = i;
    qty.append(o);
  }
  qty.value = sel.qty;
  updateTotal();
  show('qty-modal');
  qty.focus();
}

function updateTotal(){
  sel.qty = Number($('qty').value);
  $('qty-total').textContent = brl(rooms[sel.room].price * sel.qty);
}

$('qty').addEventListener('change', updateTotal);
$('qty-next').addEventListener('click', () => {
  hide('qty-modal');
  openOrder();
});

/* ---------- Passo 3: confirmação e formulário ---------- */
function openOrder(){
  const f = currentFilm(), r = rooms[sel.room], total = r.price * sel.qty;
  const dl = $('order-summary');
  dl.innerHTML = '';
  const rows = [
    ['Filme', f.title], ['Sala', `${sel.room} (${r.tipo})`], ['Horário', sel.time],
    ['Ingressos', String(sel.qty)], ['Valor unitário', brl(r.price)]
  ];
  rows.forEach(([k,v]) => { dl.append(el('dt',null,k), el('dd',null,v)); });
  const tot = el('div','total');
  tot.style.display = 'contents';
  dl.append(el('dt','total','Total'), el('dd','total', brl(total)));

  $('order-form-view').hidden = false;
  $('order-success-view').hidden = true;
  $('customer-form').reset();
  clearErrors();
  show('order-modal');
  $('nome').focus();
}

function clearErrors(){
  ['nome','email'].forEach(id => {
    $(id).removeAttribute('aria-invalid');
    $(id+'-err').textContent = '';
  });
}

function validate(){
  let ok = true;
  const nome = $('nome').value.trim();
  const email = $('email').value.trim();
  clearErrors();
  if(nome.length < 3){
    $('nome').setAttribute('aria-invalid','true');
    $('nome-err').textContent = 'Informe seu nome completo (mínimo 3 caracteres).';
    ok = false;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    $('email').setAttribute('aria-invalid','true');
    $('email-err').textContent = 'Informe um e-mail válido.';
    ok = false;
  }
  return ok;
}

$('customer-form').addEventListener('submit', e => {
  e.preventDefault();
  if(!validate()) {
    const first = document.querySelector('[aria-invalid="true"]');
    if(first) first.focus();
    return;
  }
  const code = 'CIN-' + Math.random().toString(36).slice(2,8).toUpperCase();
  const nome = $('nome').value.trim().split(' ')[0];
  $('success-code').textContent = code;
  $('success-text').textContent =
    `Obrigado, ${nome}! ${sel.qty} ingresso(s) para ${currentFilm().title}, ${sel.room}, às ${sel.time}.`;
  $('order-form-view').hidden = true;
  $('order-success-view').hidden = false;
});

/* ---------- Modais: abrir, fechar, Esc ---------- */
function show(id){ $(id).hidden = false; }
function hide(id){ $(id).hidden = true; }

document.querySelectorAll('[data-close]').forEach(b => {
  b.addEventListener('click', () => {
    hide('qty-modal'); hide('order-modal');
  });
});
document.querySelectorAll('.backdrop').forEach(bd => {
  bd.addEventListener('click', e => { if(e.target === bd) hide(bd.id); });
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ hide('qty-modal'); hide('order-modal'); }
});

renderCatalog();
</script>
</body>
</html>
