
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Sabor & Arte</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f8f6f2;
    color: #333;
}

header {
    background: #38251c;
    color: white;
    padding: 25px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #f4b942;
}

.cart-button {
    background: #e69b25;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.hero {
    background: linear-gradient(#0008, #0008),
    url("https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1400")
    center/cover;
    height: 330px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    padding: 20px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    font-size: 18px;
}

.container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

.categories {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 35px;
}

.categories button {
    padding: 12px 22px;
    border: none;
    background: #e8dfd4;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

.categories button.active,
.categories button:hover {
    background: #38251c;
    color: white;
}

.section-title {
    margin-bottom: 25px;
    color: #38251c;
    font-size: 28px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px #0001;
    transition: .3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.product-info {
    padding: 18px;
}

.product-info h3 {
    margin-bottom: 10px;
    color: #38251c;
}

.product-info p {
    color: #777;
    font-size: 14px;
    min-height: 40px;
    margin-bottom: 15px;
}

.price {
    font-size: 20px;
    font-weight: bold;
    color: #d58b19;
}

.add-button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 6px;
    background: #38251c;
    color: white;
    cursor: pointer;
}

.add-button:hover {
    background: #d58b19;
}

/* Carrinho */

.cart {
    position: fixed;
    right: -400px;
    top: 0;
    width: 350px;
    max-width: 90%;
    height: 100%;
    background: white;
    z-index: 20;
    padding: 25px;
    box-shadow: -5px 0 20px #0002;
    transition: .3s;
    overflow-y: auto;
}

.cart.open {
    right: 0;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
}

.close {
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}

.cart-item {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.remove {
    color: red;
    border: none;
    background: none;
    cursor: pointer;
}

.total {
    margin-top: 25px;
    font-size: 22px;
    font-weight: bold;
}

.checkout {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: #d58b19;
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

footer {
    margin-top: 60px;
    padding: 30px;
    text-align: center;
    background: #38251c;
    color: white;
}

@media(max-width: 600px) {
    header {
        padding: 20px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .cart {
        width: 100%;
        max-width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🍽 Sabor & Arte</div>
    <button class="cart-button" onclick="toggleCart()">
        🛒 Pedido (<span id="count">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Uma experiência de sabor!</h1>
    <p>Comida preparada com carinho e ingredientes selecionados.</p>
</section>

<main class="container">

    <nav class="categories">
        <button class="active" onclick="filterProducts('todos', this)">Todos</button>
        <button onclick="filterProducts('cafe', this)">☕ Café da manhã</button>
        <button onclick="filterProducts('executivo', this)">🍛 Executivo</button>
        <button onclick="filterProducts('alacarte', this)">🥩 À la carte</button>
        <button onclick="filterProducts('sobremesa', this)">🍰 Sobremesas</button>
        <button onclick="filterProducts('bebida', this)">🥤 Bebidas</button>
    </nav>

    <h2 class="section-title" id="categoryTitle">Nosso Cardápio</h2>

    <div class="products" id="products"></div>

</main>

<!-- Carrinho lateral -->

<aside class="cart" id="cart">
    <div class="cart-header">
        <h2>Seu Pedido</h2>
        <button class="close" onclick="toggleCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
        Total: R$ <span id="total">0.00</span>
    </div>

    <button class="checkout" onclick="checkout()">
        Finalizar Pedido
    </button>
</aside>

<footer>
    <h3>Sabor & Arte Restaurante</h3>
    <p>Rua dos Sabores, 123 - São Paulo</p>
    <p>Funcionamento: Segunda a Domingo, das 7h às 22h</p>
    <p>© 2026 - Todos os direitos reservados.</p>
</footer>

<script>

const products = [
    {
        id: 1,
        name: "Café Completo",
        description: "Café, pão francês, manteiga, queijo e frutas.",
        price: 24.90,
        category: "cafe",
        image: "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=500"
    },
    {
        id: 2,
        name: "Panquecas Americanas",
        description: "Panquecas com mel, frutas e manteiga.",
        price: 28.90,
        category: "cafe",
        image: "https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=500"
    },
    {
        id: 3,
        name: "Prato Executivo",
        description: "Arroz, feijão, bife acebolado e salada.",
        price: 34.90,
        category: "executivo",
        image: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=500"
    },
    {
        id: 4,
        name: "Frango Grelhado",
        description: "Filé de frango, arroz, legumes e batatas.",
        price: 32.90,
        category: "executivo",
        image: "https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=500"
    },
    {
        id: 5,
        name: "Filé à Parmegiana",
        description: "Filé empanado, molho de tomate e queijo.",
        price: 59.90,
        category: "alacarte",
        image: "https://images.unsplash.com/photo-1632778149955-e80f8ceca2e8?w=500"
    },
    {
        id: 6,
        name: "Salmão Grelhado",
        description: "Salmão acompanhado de legumes e purê.",
        price: 69.90,
        category: "alacarte",
        image: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=500"
    },
    {
        id: 7,
        name: "Petit Gâteau",
        description: "Bolo de chocolate com sorvete de creme.",
        price: 22.90,
        category: "sobremesa",
        image: "https://images.unsplash.com/photo-1624353365286-3f8d62daad51?w=500"
    },
    {
        id: 8,
        name: "Cheesecake",
        description: "Cheesecake artesanal com calda de frutas.",
        price: 19.90,
        category: "sobremesa",
        image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=500"
    },
    {
        id: 9,
        name: "Suco Natural",
        description: "Suco natural de laranja, sem conservantes.",
        price: 9.90,
        category: "bebida",
        image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=500"
    },
    {
        id: 10,
        name: "Refrigerante",
        description: "Lata de refrigerante 350ml.",
        price: 7.00,
        category: "bebida",
        image: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=500"
    },
    {
        id: 11,
        name: "Cappuccino",
        description: "Cappuccino cremoso com chocolate.",
        price: 12.90,
        category: "cafe",
        image: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=500"
    },
    {
        id: 12,
        name: "Água Mineral",
        description: "Água mineral sem gás 500ml.",
        price: 4.50,
        category: "bebida",
        image: "https://images.unsplash.com/photo-1523362628745-0c100150b504?w=500"
    }
];

let cart = [];

const money = value => value.toFixed(2).replace(".", ",");

function renderProducts(category = "todos") {

    const container = document.getElementById("products");

    const filtered = category === "todos"
        ? products
        : products.filter(p => p.category === category);

    container.innerHTML = filtered.map(p => `
        <article class="product">
            <img src="${p.image}" alt="${p.name}" loading="lazy">
            <div class="product-info">
                <h3>${p.name}</h3>
                <p>${p.description}</p>
                <span class="price">R$ ${money(p.price)}</span>
                <button class="add-button"
                    onclick="addToCart(${p.id})">
                    + Adicionar ao Pedido
                </button>
            </div>
        </article>
    `).join("");

    const titles = {
        todos: "Nosso Cardápio",
        cafe: "☕ Café da Manhã",
        executivo: "🍛 Pratos Executivos",
        alacarte: "🥩 À la Carte",
        sobremesa: "🍰 Sobremesas",
        bebida: "🥤 Bebidas"
    };

    document.getElementById("categoryTitle").textContent =
        titles[category];
}

function filterProducts(category, button) {

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderProducts(category);
}

function addToCart(id) {

    const product = products.find(p => p.id === id);

    const item = cart.find(p => p.id === id);

    if (item) {
        item.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    updateCart();
}

function removeFromCart(id) {

    cart = cart.filter(p => p.id !== id);

    updateCart();
}

function updateCart() {

    const container = document.getElementById("cartItems");

    let total = 0;
    let count = 0;

    container.innerHTML = cart.map(p => {

        total += p.price * p.quantity;
        count += p.quantity;

        return `
            <div class="cart-item">
                <div>
                    <strong>${p.name}</strong>
                    <p>${p.quantity} x R$ ${money(p.price)}</p>
                </div>

                <button class="remove"
                    onclick="removeFromCart(${p.id})">
                    Remover
                </button>
            </div>
        `;

    }).join("");

    if (cart.length === 0) {
        container.innerHTML = "<p>Seu pedido está vazio.</p>";
    }

    document.getElementById("count").textContent = count;

    document.getElementById("total").textContent =
        money(total);
}

function toggleCart() {
    document.getElementById("cart").classList.toggle("open");
}

function checkout() {

    if (cart.length === 0) {
        alert("Adicione produtos ao seu pedido!");
        return;
    }

    let message = "Olá! Gostaria de fazer o seguinte pedido:\n\n";

    cart.forEach(p => {
        message += `${p.quantity}x ${p.name} - R$ ${money(p.price * p.quantity)}\n`;
    });

    const total = cart.reduce(
        (sum, p) => sum + p.price * p.quantity, 0
    );

    message += `\nTotal: R$ ${money(total)}`;

    const whatsappNumber = "5511999999999";

    window.open(
        `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`,
        "_blank"
    );
}

renderProducts();
updateCart();

</script>

</body>
</html>
