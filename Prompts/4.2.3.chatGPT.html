
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Castração Animal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #23845c;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #23845c;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #23845c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #176641;
        }

        .aviso {
            font-size: 13px;
            color: #777;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🐾 Agendamento de Castração</h1>

        <p>Agende uma consulta pré-operatória para seu pet!</p>

        <form action="#" method="post">

            <label for="tutor">Nome do Tutor:</label>
            <input
                type="text"
                id="tutor"
                name="tutor"
                placeholder="Digite seu nome completo"
                required
            >

            <label for="pet">Nome do Animal:</label>
            <input
                type="text"
                id="pet"
                name="pet"
                placeholder="Digite o nome do seu pet"
                required
            >

            <label for="especie">Espécie:</label>
            <select id="especie" name="especie" required>
                <option value="">Selecione a espécie</option>
                <option value="cao">Cão</option>
                <option value="gato">Gato</option>
            </select>

            <label for="peso">Peso aproximado (kg):</label>
            <input
                type="number"
                id="peso"
                name="peso"
                placeholder="Exemplo: 5.5"
                min="0.1"
                step="0.1"
                required
            >

            <label for="data">Data de preferência:</label>
            <input
                type="date"
                id="data"
                name="data"
                required
            >

            <label for="telefone">Telefone para contato:</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required
            >

            <button type="submit">
                Solicitar Agendamento
            </button>

            <div class="aviso">
                * O agendamento é uma solicitação de consulta.
                A data será confirmada pela equipe veterinária.
            </div>

        </form>

    </div>

</body>
</html>
