<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cine Vila Nova — Horários e Reservas</title>
<style>
:root{--bg:#0f0f14;--panel:#1a1a24;--panel2:#232334;--text:#f2f2f7;--muted:#9a9ab0;--accent:#f5b301;--accent-ink:#1a1400;--ok:#2ecc71;--bad:#e74c3c;--seat:#3a3a52;--line:#2c2c40;--field:#3d3d58}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
header{padding:28px 20px 22px;background:linear-gradient(180deg,#1e1b2e,var(--bg));border-bottom:1px solid var(--line)}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
h1{margin:0;font-size:28px;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
h2{font-size:20px;margin:28px 0 12px}
h3{margin:0 0 4px;font-size:19px}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.date-btn{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:center;min-width:80px;font:inherit}
.date-btn small{display:block;color:var(--muted);text-transform:uppercase;font-size:11px}
.date-btn strong{font-size:18px}
.date-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.date-btn.active small{color:var(--accent-ink)}
.movie{display:grid;grid-template-columns:110px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.poster{border-radius:10px;height:150px;display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}
.meta{color:var(--muted);font-size:14px;margin:2px 0 10px}
.times{display:flex;flex-wrap:wrap;gap:8px}
.time-btn{background:var(--panel2);border:1px solid var(--field);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left}
.time-btn:hover:not(:disabled){border-color:var(--accent)}
.time-btn b{display:block;font-size:16px}
.time-btn small{color:var(--muted);font-size:12px}
.time-btn:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--muted);padding:20px;text-align:center;background:var(--panel);border-radius:12px}
.bk{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
.bk .meta{margin:2px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.close{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--muted);font-size:28px;cursor:pointer}
.screen{text-align:center;background:linear-gradient(#3a3a52,transparent);height:30px;border-radius:50% 50% 0 0/100% 100% 0 0;color:var(--muted);font-size:12px;letter-spacing:4px;line-height:30px;margin:16px auto 12px;max-width:90%}
.seats{margin-top:4px}
.row{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:6px}
.rl{width:16px;color:var(--muted);font-size:12px;text-align:center}
.seat{width:28px;height:26px;border-radius:6px 6px 3px 3px;border:0;background:var(--seat);color:var(--text);font:inherit;font-size:11px;cursor:pointer;padding:0}
.seat.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seat.occ{background:#2a2a36;color:#55556a;cursor:not-allowed;text-decoration:line-through}
.legend{display:flex;gap:14px;justify-content:center;color:var(--muted);font-size:13px;flex-wrap:wrap;margin:10px 0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label.full{grid-column:1/-1}
input,select{background:var(--panel2);border:1px solid var(--field);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit}
.sel-info{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 0}
.total{text-align:center;font-size:18px;font-weight:700;margin-top:6px}
.err{color:#ff8a80;font-size:14px;min-height:20px;margin:10px 0 0;text-align:center}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--field);border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit}
.danger-btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.success{text-align:center;padding:10px 0}
.check{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;line-height:56px;margin:0 auto 10px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;letter-spacing:6px;color:var(--accent);margin:8px 0 14px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 20px}
@media(max-width:600px){.movie{grid-template-columns:1fr}.poster{height:90px}.form-grid{grid-template-columns:1fr}.seat{width:24px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Cine <span>Vila Nova</span></h1>
    <p class="sub">Programação e reservas online · Rua das Flores, 120 — Centro</p>
  </div>
</header>

<main class="wrap">
  <h2>Escolha o dia</h2>
  <div class="dates" id="dates"></div>

  <h2>Em cartaz</h2>
  <section id="movies"></section>

  <h2>Minhas reservas</h2>
  <section id="bookings"></section>
</main>

<footer>
  Demonstração: as reservas ficam salvas apenas neste navegador. O pagamento é feito na bilheteria, com o código da reserva.
</footer>

<div class="modal-bg" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="close" data-close aria-label="Fechar">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const MOVIES = [
  {id:'m1', title:'O Último Farol',   genre:'Drama',             dur:118, rating:'14',    grad:'linear-gradient(135deg,#0ea5e9,#1e3a8a)'},
  {id:'m2', title:'Galáxia Perdida',  genre:'Ficção científica', dur:132, rating:'12',    grad:'linear-gradient(135deg,#a855f7,#312e81)'},
  {id:'m3', title:'Risos na Praça',   genre:'Comédia',           dur:97,  rating:'Livre', grad:'linear-gradient(135deg,#f97316,#9a3412)'},
  {id:'m4', title:'Sombras do Porto', genre:'Suspense',          dur:109, rating:'16',    grad:'linear-gradient(135deg,#14b8a6,#134e4a)'}
];
const SLOTS = ['14:00','16:20','18:40','21:00'];
const PRICE = {inteira:32, meia:16};
const ROWS = 'ABCDEFGH';
const COLS = 10;
const MAX_SEATS = 8;
const STORE_KEY = 'cinevila-reservas-v1';
const SEATS = [];
for (const r of ROWS) for (let c = 1; c <= COLS; c++) SEATS.push(r + c);

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = v => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtDate = k => { const [y,m,d] = k.split('-'); return `${d}/${m}/${y}`; };

const today = new Date(); today.setHours(0,0,0,0);
const dayDates = () => Array.from({length:7}, (_, i) => addDays(today, i));

// Estado
let selIdx = 0;
let currentSessions = {};
let cur = null;          // sessão aberta no modal
let selected = new Set();
let bookings = loadBookings();

function loadBookings(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e) { return []; }
}
function saveBookings(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(bookings)); } catch(e) {}
}

// Sessões geradas de forma determinística por dia e filme
function sessionsFor(idx){
  const dateKey = keyOf(dayDates()[idx]);
  const out = [];
  MOVIES.forEach((m, i) => {
    SLOTS.forEach((t, k) => {
      if ((k + i + idx) % 3 !== 0) {
        out.push({
          id: `${dateKey}_${m.id}_${t.replace(':','')}`,
          movie: m, date: dateKey, time: t,
          room: `Sala ${((i + k + idx) % 3) + 1}`
        });
      }
    });
  });
  return out;
}

function isPast(s){
  const [h, mi] = s.time.split(':').map(Number);
  const dt = new Date(s.date + 'T00:00:00');
  dt.setHours(h, mi, 0, 0);
  return dt < new Date();
}

// Lugares ocupados: base simulada + reservas feitas neste navegador
function seatHash(sid, seat){
  const str = sid + '|' + seat;
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) % 100;
}
function takenSeats(sid){
  const set = new Set(SEATS.filter(seat => seatHash(sid, seat) < 22));
  bookings.filter(b => b.sid === sid).forEach(b => b.seats.forEach(x => set.add(x)));
  return set;
}

// Renderização da página
function renderDates(){
  document.getElementById('dates').innerHTML = dayDates().map((d, i) => `
    <button class="date-btn${i === selIdx ? ' active' : ''}" data-i="${i}" aria-pressed="${i === selIdx}">
      <small>${i === 0 ? 'Hoje' : d.toLocaleDateString('pt-BR', {weekday:'short'}).replace('.', '')}</small>
      <strong>${pad(d.getDate())}/${pad(d.getMonth()+1)}</strong>
    </button>`).join('');
}

function renderMovies(){
  const list = sessionsFor(selIdx);
  currentSessions = {};
  list.forEach(s => currentSessions[s.id] = s);
  document.getElementById('movies').innerHTML = MOVIES.map(m => {
    const ss = list.filter(s => s.movie.id === m.id);
    const times = ss.length ? ss.map(s => {
      const free = SEATS.length - takenSeats(s.id).size;
      const past = isPast(s);
      const status = past ? 'Encerrada' : free === 0 ? 'Esgotada' : `${free} lugares livres`;
      return `<button class="time-btn" data-sid="${s.id}" ${past || free === 0 ? 'disabled' : ''}>
                <b>${s.time}</b><small>${s.room} · ${status}</small></button>`;
    }).join('') : '<span class="meta">Sem sessões neste dia.</span>';
    const classif = m.rating === 'Livre' ? 'Livre' : m.rating + ' anos';
    return `
      <article class="movie">
        <div class="poster" style="background:${m.grad}">${classif}</div>
        <div>
          <h3>${esc(m.title)}</h3>
          <div class="meta">${esc(m.genre)} · ${m.dur} min</div>
          <div class="times">${times}</div>
        </div>
      </article>`;
  }).join('');
}

function renderBookings(){
  const el = document.getElementById('bookings');
  if (!bookings.length) { el.innerHTML = '<div class="empty">Você ainda não tem reservas.</div>'; return; }
  el.innerHTML = bookings.slice().reverse().map(b => `
    <div class="bk">
      <div>
        <strong>${esc(b.movie)}</strong>
        <div class="meta">${fmtDate(b.date)} · ${b.time} · ${esc(b.room)} · Lugares ${b.seats.join(', ')}</div>
        <div class="meta">Código <span class="mono">${b.code}</span> · ${b.type === 'meia' ? 'Meia-entrada' : 'Inteira'} · ${fmtBRL(b.total)}</div>
      </div>
      <button class="ghost danger-btn" data-cancel="${b.code}">Cancelar</button>
    </div>`).join('');
}

// Modal de reserva
function openModal(s){
  cur = s;
  selected = new Set();
  document.getElementById('modal-body').innerHTML = `
    <h3 id="modal-title">${esc(s.movie.title)}</h3>
    <p class="meta">${fmtDate(s.date)} · ${s.time} · ${s.room}</p>
    <div class="screen">TELA</div>
    <div class="seats" id="seats"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--seat)"></i>Livre</span>
      <span><i class="sw" style="background:var(--accent)"></i>Selecionado</span>
      <span><i class="sw" style="background:#2a2a36"></i>Ocupado</span>
    </div>
    <p class="sel-info" id="sel-info"></p>
    <div class="form-grid">
      <label class="full">Nome completo<input id="f-name" autocomplete="name" maxlength="80"></label>
      <label>E-mail<input id="f-email" type="email" autocomplete="email" maxlength="120"></label>
      <label>Telefone (opcional)<input id="f-phone" type="tel" autocomplete="tel" maxlength="20"></label>
      <label class="full">Tipo de ingresso
        <select id="f-type">
          <option value="inteira">Inteira — ${fmtBRL(PRICE.inteira)}</option>
          <option value="meia">Meia-entrada — ${fmtBRL(PRICE.meia)}</option>
        </select>
      </label>
    </div>
    <p class="total" id="total"></p>
    <p class="err" id="f-err"></p>
    <div class="actions">
      <button class="ghost" id="btn-cancel">Voltar</button>
      <button class="primary" id="btn-confirm">Confirmar reserva</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
  renderSeats();
  updateSel();
  setTimeout(() => document.getElementById('f-name').focus(), 0);
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  cur = null;
  selected = new Set();
}

function renderSeats(){
  const taken = takenSeats(cur.id);
  document.getElementById('seats').innerHTML = [...ROWS].map(r => `
    <div class="row"><span class="rl">${r}</span>${
      Array.from({length: COLS}, (_, c) => {
        const id = r + (c + 1);
        const occ = taken.has(id), sel = selected.has(id);
        return `<button class="seat${occ ? ' occ' : ''}${sel ? ' sel' : ''}" data-seat="${id}"
                  ${occ ? 'disabled' : ''} aria-label="Lugar ${id}${occ ? ', ocupado' : ''}">${c + 1}</button>`;
      }).join('')
    }</div>`).join('');
}

function setErr(msg){ document.getElementById('f-err').textContent = msg; }

function updateSel(){
  const n = selected.size;
  const type = document.getElementById('f-type').value;
  const total = n * PRICE[type];
  document.getElementById('sel-info').textContent = n
    ? `${n} lugar(es): ${[...selected].sort().join(', ')}`
    : 'Escolha seus lugares no mapa (até 8)';
  document.getElementById('total').textContent = `Total: ${fmtBRL(total)}`;
}

function toggleSeat(id){
  if (selected.has(id)) selected.delete(id);
  else if (selected.size >= MAX_SEATS) { setErr(`Máximo de ${MAX_SEATS} lugares por reserva.`); return; }
  else selected.add(id);
  setErr('');
  renderSeats();
  updateSel();
}

function randomCode(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += alphabet[Math.floor(Math.random() * alphabet.length)];
  return s;
}

function confirmBooking(){
  const name = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const type = document.getElementById('f-type').value;

  if (name.length < 3) return setErr('Informe seu nome completo.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setErr('Informe um e-mail válido.');
  if (selected.size === 0) return setErr('Selecione pelo menos um lugar.');

  // Verifica se algum lugar foi reservado enquanto o modal estava aberto
  const taken = takenSeats(cur.id);
  const conflicts = [...selected].filter(x => taken.has(x));
  if (conflicts.length) {
    conflicts.forEach(x => selected.delete(x));
    renderSeats(); updateSel();
    return setErr('Alguns lugares acabaram de ser reservados. Escolha novamente.');
  }

  const seats = [...selected].sort();
  const booking = {
    code: randomCode(), sid: cur.id, movie: cur.movie.title,
    date: cur.date, time: cur.time, room: cur.room,
    seats, type, total: seats.length * PRICE[type],
    name, email, phone, createdAt: Date.now()
  };
  bookings.push(booking);
  saveBookings();

  document.getElementById('modal-body').innerHTML = `
    <div class="success">
      <div class="check">✓</div>
      <h3 id="modal-title">Reserva confirmada!</h3>
      <p class="meta">Apresente este código na bilheteria</p>
      <div class="code">${booking.code}</div>
      <p class="meta">
        ${esc(booking.movie)}<br>
        ${fmtDate(booking.date)} · ${booking.time} · ${esc(booking.room)}<br>
        Lugares ${seats.join(', ')} · ${type === 'meia' ? 'Meia-entrada' : 'Inteira'}<br>
        Total: <strong>${fmtBRL(booking.total)}</strong> (pago na bilheteria)
      </p>
      <div class="actions" style="justify-content:center">
        <button class="primary" id="btn-done">Fechar</button>
      </div>
    </div>`;
  renderMovies();
  renderBookings();
}

// Eventos
document.getElementById('dates').addEventListener('click', e => {
  const b = e.target.closest('.date-btn');
  if (!b) return;
  selIdx = Number(b.dataset.i);
  renderDates();
  renderMovies();
});

document.getElementById('movies').addEventListener('click', e => {
  const b = e.target.closest('.time-btn');
  if (b && !b.disabled) openModal(currentSessions[b.dataset.sid]);
});

document.getElementById('bookings').addEventListener('click', e => {
  const b = e.target.closest('[data-cancel]');
  if (!b) return;
  if (!b.dataset.armed) {
    b.dataset.armed = '1';
    b.classList.add('armed');
    b.textContent = 'Confirmar cancelamento';
    setTimeout(() => { delete b.dataset.armed; b.classList.remove('armed'); b.textContent = 'Cancelar'; }, 4000);
    return;
  }
  bookings = bookings.filter(x => x.code !== b.dataset.cancel);
  saveBookings();
  renderMovies();
  renderBookings();
});

const modal = document.getElementById('modal');
modal.addEventListener('click', e => {
  if (e.target === modal || e.target.closest('[data-close]') || e.target.id === 'btn-cancel' || e.target.id === 'btn-done') {
    closeModal();
    return;
  }
  const seat = e.target.closest('.seat');
  if (seat && !seat.disabled) { toggleSeat(seat.dataset.seat); return; }
  if (e.target.id === 'btn-confirm') confirmBooking();
});
modal.addEventListener('change', e => {
  if (e.target.id === 'f-type') updateSel();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && cur) closeModal();
});

// Inicialização
renderDates();
renderMovies();
renderBookings();
</script>
</body>
</html>
