<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineLocal - Agendamento de Sessões</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    color:#fff;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
}

header h1{
    color:#ffcc00;
}

.filmes{
    max-width:1200px;
    margin:40px auto;
    padding:20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#1b1b1b;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

.card img{
    width:100%;
    height:420px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h2{
    margin-bottom:10px;
}

.sala{
    color:#ffcc00;
    margin-bottom:15px;
}

.horarios{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.horario{
    background:#ffcc00;
    color:#000;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.horario:hover{
    transform:scale(1.05);
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.8);
    z-index:999;
}

.modal-content{
    background:#fff;
    color:#000;
    width:90%;
    max-width:450px;
    padding:25px;
    border-radius:12px;
}

.modal-content h2{
    margin-bottom:15px;
}

.modal-content input,
.modal-content select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
}

.modal-content button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ffcc00;
    font-weight:bold;
    cursor:pointer;
}

.fechar{
    float:right;
    cursor:pointer;
    font-size:20px;
    font-weight:bold;
}

.resumo{
    background:#f5f5f5;
    padding:10px;
    margin-bottom:15px;
    border-radius:8px;
}

.sucesso{
    text-align:center;
    padding:15px;
    color:green;
    font-weight:bold;
}
</style>
</head>
<body>

<header>
    <h1>🎬 CineLocal</h1>
    <p>Escolha seu filme e reserve seus ingressos</p>
</header>

<section class="filmes">

    <!-- Filme 1 -->
    <article class="card">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800" alt="Filme">
        <div class="card-content">
            <h2>Missão Galáctica</h2>
            <p class="sala">Sala 1</p>

            <div class="horarios">
                <button class="horario" data-filme="Missão Galáctica" data-sala="Sala 1" data-horario="14:00">14:00</button>
                <button class="horario" data-filme="Missão Galáctica" data-sala="Sala 1" data-horario="17:00">17:00</button>
                <button class="horario" data-filme="Missão Galáctica" data-sala="Sala 1" data-horario="20:00">20:00</button>
            </div>
        </div>
    </article>

    <!-- Filme 2 -->
    <article class="card">
        <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=800" alt="Filme">
        <div class="card-content">
            <h2>Aventura Perdida</h2>
            <p class="sala">Sala 2</p>

            <div class="horarios">
                <button class="horario" data-filme="Aventura Perdida" data-sala="Sala 2" data-horario="15:30">15:30</button>
                <button class="horario" data-filme="Aventura Perdida" data-sala="Sala 2" data-horario="18:30">18:30</button>
                <button class="horario" data-filme="Aventura Perdida" data-sala="Sala 2" data-horario="21:30">21:30</button>
            </div>
        </div>
    </article>

    <!-- Filme 3 -->
    <article class="card">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=800" alt="Filme">
        <div class="card-content">
            <h2>Terror Noturno</h2>
            <p class="sala">Sala 3</p>

            <div class="horarios">
                <button class="horario" data-filme="Terror Noturno" data-sala="Sala 3" data-horario="16:00">16:00</button>
                <button class="horario" data-filme="Terror Noturno" data-sala="Sala 3" data-horario="19:00">19:00</button>
                <button class="horario" data-filme="Terror Noturno" data-sala="Sala 3" data-horario="22:00">22:00</button>
            </div>
        </div>
    </article>

</section>

<!-- Modal Seleção de Ingressos -->
<div class="modal" id="modalIngressos">
    <div class="modal-content">
        <span class="fechar" id="fechar1">&times;</span>

        <h2>Selecionar Ingressos</h2>

        <div class="resumo" id="resumoSessao"></div>

        <label>Quantidade de Ingressos</label>
        <select id="quantidade">
            <option value="1">1 Ingresso</option>
            <option value="2">2 Ingressos</option>
            <option value="3">3 Ingressos</option>
            <option value="4">4 Ingressos</option>
            <option value="5">5 Ingressos</option>
        </select>

        <button id="continuar">
            Continuar
        </button>
    </div>
</div>

<!-- Modal Confirmação -->
<div class="modal" id="modalConfirmacao">
    <div class="modal-content">
        <span class="fechar" id="fechar2">&times;</span>

        <h2>Confirmar Reserva</h2>

        <div class="resumo" id="resumoFinal"></div>

        <form id="formReserva">

            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Seu e-mail"
                required
            >

            <button type="submit">
                Confirmar Agendamento
            </button>

        </form>

        <div id="mensagem"></div>

    </div>
</div>

<script>

let dadosReserva = {};

const modalIngressos = document.getElementById("modalIngressos");
const modalConfirmacao = document.getElementById("modalConfirmacao");

document.querySelectorAll(".horario")
.forEach(botao => {

    botao.addEventListener("click", () => {

        dadosReserva.filme = botao.dataset.filme;
        dadosReserva.sala = botao.dataset.sala;
        dadosReserva.horario = botao.dataset.horario;

        document.getElementById("resumoSessao").innerHTML = `
            <strong>Filme:</strong> ${dadosReserva.filme}<br>
            <strong>${dadosReserva.sala}</strong><br>
            <strong>Horário:</strong> ${dadosReserva.horario}
        `;

        modalIngressos.style.display = "flex";
    });

});

document.getElementById("continuar")
.addEventListener("click", () => {

    dadosReserva.quantidade =
        document.getElementById("quantidade").value;

    document.getElementById("resumoFinal").innerHTML = `
        <strong>Filme:</strong> ${dadosReserva.filme}<br>
        <strong>Sala:</strong> ${dadosReserva.sala}<br>
        <strong>Horário:</strong> ${dadosReserva.horario}<br>
        <strong>Ingressos:</strong> ${dadosReserva.quantidade}
    `;

    modalIngressos.style.display = "none";
    modalConfirmacao.style.display = "flex";

});

document.getElementById("formReserva")
.addEventListener("submit", function(e){

    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;

    document.getElementById("mensagem").innerHTML = `
        <div class="sucesso">
            ✅ Reserva confirmada!<br><br>
            Cliente: ${nome}<br>
            E-mail: ${email}
        </div>
    `;

    this.reset();
});

document.getElementById("fechar1")
.addEventListener("click", () => {
    modalIngressos.style.display = "none";
});

document.getElementById("fechar2")
.addEventListener("click", () => {
    modalConfirmacao.style.display = "none";
});

window.addEventListener("click", (e) => {

    if(e.target === modalIngressos){
        modalIngressos.style.display = "none";
    }

    if(e.target === modalConfirmacao){
        modalConfirmacao.style.display = "none";
    }

});

</script>

</body>
</html>
