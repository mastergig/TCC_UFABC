Node","valueType":"node"},"label":"Elementos com falha"}],"items":[]}},"meta-refresh":{"id":"meta-refresh","title":"O documento não usa `\u003cmeta http-equiv=\"refresh\">`","description":"O usuário não espera a atualização automática da página, o que move o foco novamente para a parte superior dela. Isso pode causar uma experiência confusa ou frustrante. [Saiba mais sobre a metatag de atualização](https://dequeuniversity.com/rules/axe/4.12/meta-refresh).","score":null,"scoreDisplayMode":"notApplicable"},"meta-viewport":{"id":"meta-viewport","title":"`[user-scalable=\"no\"]` não é usado no elemento `\u003cmeta name=\"viewport\">`, e o atributo `[maximum-scale]` não é menor que 5.","description":"A desativação do zoom gera problemas para usuários com baixa visão que utilizam a ampliação de tela para enxergar corretamente o conteúdo de uma página da Web. [Saiba mais sobre a metatag viewport](https://dequeuniversity.com/rules/axe/4.12/meta-viewport).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos com falha"}],"items":[]}},"object-alt":{"id":"object-alt","title":"Os elementos `\u003cobject>` têm texto alternativo","description":"Os leitores de tela não traduzem conteúdo não textual. A adição de texto alternativo a elementos `\u003cobject>` ajuda os leitores de tela a transmitir o significado para os usuários. [Saiba mais sobre texto alternativo para elementos `object`](https://dequeuniversity.com/rules/axe/4.12/object-alt).","score":null,"scoreDisplayMode":"notApplicable"},"select-name":{"id":"select-name","title":"Os elementos de \u003cselect> têm elementos de \u003clabel> associados.","description":"Elementos de \u003cform> sem rótulos eficazes podem criar experiências frustrantes para usuários de leitores de tela. [Saiba mais sobre o elemento `select`](https://dequeuniversity.com/rules/axe/4.12/select-name).","score":null,"scoreDisplayMode":"notApplicable"},"skip-link":{"id":"skip-link","title":"Links de salto são focalizáveis.","description":"Com a inclusão de um link de salto, os usuários podem pular o conteúdo principal e economizar tempo. [Saiba mais sobre links de salto](https://dequeuniversity.com/rules/axe/4.12/skip-link).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos com falha"}],"items":[]}},"tabindex":{"id":"tabindex","title":"Nenhum elemento tem um valor de `[tabindex]` maior que 0","description":"Um valor maior que 0 indica uma ordem explícita de navegação. Embora tecnicamente válido, isso costuma gerar experiências frustrantes para os usuários que utilizam tecnologias adaptativas. [Saiba mais sobre o atributo `tabindex`](https://dequeuniversity.com/rules/axe/4.12/tabindex).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos com falha"}],"items":[]}},"table-duplicate-name":{"id":"table-duplicate-name","title":"As tabelas têm conteúdo diferente no atributo de resumo e em `\u003ccaption>`.","description":"O atributo de resumo precisa descrever a estrutura da tabela, enquanto `\u003ccaption>` precisa ter o título na tela. A marcação precisa de tabelas ajuda os usuários de leitores de tela. [Saiba mais sobre resumos e legendas](https://dequeuniversity.com/rules/axe/4.12/table-duplicate-name).","score":null,"scoreDisplayMode":"notApplicable"},"table-fake-caption":{"id":"table-fake-caption","title":"As tabelas usam `\u003ccaption>` em vez de células com o atributo `[colspan]` para indicar uma legenda.","description":"Os leitores de tela têm recursos para facilitar a navegação em tabelas. Garantir que as tabelas usem o elemento de legenda em vez de células com o atributo `[colspan]` pode melhorar a experiência
