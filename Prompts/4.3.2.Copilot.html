<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Style Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#111;
    color:#fff;
    padding:20px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:1.8rem;
    font-weight:bold;
}

.cart-button{
    position:relative;
    cursor:pointer;
    font-size:1.2rem;
}

.cart-count{
    position:absolute;
    top:-10px;
    right:-12px;
    background:#ff3c3c;
    color:#fff;
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.8rem;
}

.hero{
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
    color:white;
    text-align:center;
    padding:100px 20px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero p{
    font-size:1.1rem;
}

.section-title{
    text-align:center;
    margin:40px 0 20px;
    font-size:2rem;
}

.products{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding-bottom:50px;
}

.product{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    transition:.3s;
}

.product:hover{
    transform:translateY(-5px);
}

.product img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:10px;
}

.price{
    font-size:1.2rem;
    color:#27ae60;
    font-weight:bold;
    margin-bottom:15px;
}

.btn{
    width:100%;
    border:none;
    background:#111;
    color:white;
    padding:12px;
    cursor:pointer;
    border-radius:8px;
    font-size:1rem;
}

.btn:hover{
    background:#333;
}

.cart-sidebar{
    position:fixed;
    right:-420px;
    top:0;
    width:420px;
    max-width:95%;
    height:100vh;
    background:#fff;
    box-shadow:-5px 0 15px rgba(0,0,0,.2);
    transition:.4s;
    padding:20px;
    overflow-y:auto;
    z-index:2000;
}

.cart-sidebar.active{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close-cart{
    font-size:28px;
    cursor:pointer;
}

.cart-item{
    display:flex;
    gap:10px;
    align-items:center;
    margin:15px 0;
    border-bottom:1px solid #ddd;
    padding-bottom:12px;
}

.cart-item img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.cart-item-info{
    flex:1;
}

.quantity-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:5px;
}

.quantity-controls button{
    width:28px;
    height:28px;
    border:none;
    background:#111;
    color:#fff;
    cursor:pointer;
    border-radius:4px;
}

.remove-btn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    margin-top:8px;
}

.cart-total{
    margin-top:20px;
    font-size:1.4rem;
    font-weight:bold;
}

.checkout-btn{
    width:100%;
    margin-top:20px;
    background:#27ae60;
    padding:14px;
    border:none;
    color:#fff;
    cursor:pointer;
    border-radius:8px;
    font-size:1rem;
}
</style>
</head>
<body>

<header>
    <div class="logo">Urban Style</div>

    <div class="cart-button" id="openCart">
        🛒 Carrinho
        <span class="cart-count" id="cartCount">0</span>
    </div>
</header>

<section class="hero">
    <h1>Moda Urbana Premium</h1>
    <p>As melhores tendências streetwear para seu estilo.</p>
</section>

<h2 class="section-title">Produtos em Destaque</h2>

<section class="products" id="productsContainer"></section>

<aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h2>Seu Carrinho</h2>
        <span class="close-cart" id="closeCart">&times;</span>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
        Total: R$ <span id="cartTotal">0.00</span>
    </div>

    <button class="checkout-btn">
        Finalizar Compra
    </button>
</aside>

<script>
const products = [
{
    id:1,
    name:"Camiseta Oversized",
    price:89.90,
    image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
},
{
    id:2,
    name:"Jaqueta Street",
    price:249.90,
    image:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80"
},
{
    id:3,
    name:"Moletom Urban",
    price:179.90,
    image:"https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=80"
},
{
    id:4,
    name:"Calça Cargo",
    price:199.90,
    image:"https://images.unsplash.com/photo-1514996937319-344454492b37?auto=format&fit=crop&w=800&q=80"
},
{
    id:5,
    name:"Tênis Casual",
    price:299.90,
    image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
},
{
    id:6,
    name:"Boné Urban",
    price:69.90,
    image:"https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=800&q=80"
}
];

const cart = [];

const productsContainer = document.getElementById("productsContainer");
const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");
const cartCount = document.getElementById("cartCount");

function renderProducts(){
    productsContainer.innerHTML = products.map(product => `
        <div class="product">
            <img src="${product.image}" alt="${product.name}">
            <div class="product-info">
                <h3>${product.name}</h3>
                <div class="price">
                    R$ ${product.price.toFixed(2)}
                </div>
                <button class="btn" onclick="addToCart(${product.id})">
                    Adicionar ao Carrinho
                </button>
            </div>
        </div>
    `).join('');
}

function addToCart(id){
    const item = cart.find(prod => prod.id === id);

    if(item){
        item.quantity++;
    } else {
        const product = products.find(prod => prod.id === id);

        cart.push({
            ...product,
            quantity:1
        });
    }

    updateCart();
}

function updateCart(){

    cartItems.innerHTML = '';

    let total = 0;
    let quantityTotal = 0;

    cart.forEach(item => {

        total += item.price * item.quantity;
        quantityTotal += item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <img src="${item.image}">
                <div class="cart-item-info">
                    <strong>${item.name}</strong>
                    <p>R$ ${item.price.toFixed(2)}</p>

                    <div class="quantity-controls">
                        <button onclick="changeQuantity(${item.id}, -1)">-</button>

                        <span>${item.quantity}</span>

                        <button onclick="changeQuantity(${item.id}, 1)">+</button>
                    </div>

                    <button class="remove-btn"
                        onclick="removeItem(${item.id})">
                        Remover
                    </button>
                </div>
            </div>
        `;
    });

    cartTotal.textContent = total.toFixed(2);
    cartCount.textContent = quantityTotal;
}

function changeQuantity(id, value){

    const item = cart.find(prod => prod.id === id);

    if(!item) return;

    item.quantity += value;

    if(item.quantity <= 0){
        removeItem(id);
        return;
    }

    updateCart();
}

function removeItem(id){

    const index = cart.findIndex(prod => prod.id === id);

    if(index !== -1){
        cart.splice(index,1);
    }

    updateCart();
}

document.getElementById("openCart").addEventListener("click", () => {
    document.getElementById("cartSidebar").classList.add("active");
});

document.getElementById("closeCart").addEventListener("click", () => {
    document.getElementById("cartSidebar").classList.remove("active");
});

renderProducts();
</script>

</body>
</html>
