es/axe/4.12/listitem).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos com falha"}],"items":[]}},"meta-refresh":{"id":"meta-refresh","title":"O documento não usa `\u003cmeta http-equiv=\"refresh\">`","description":"O usuário não espera a atualização automática da página, o que move o foco novamente para a parte superior dela. Isso pode causar uma experiência confusa ou frustrante. [Saiba mais sobre a metatag de atualização](https://dequeuniversity.com/rules/axe/4.12/meta-refresh).","score":null,"scoreDisplayMode":"notApplicable"},"meta-viewport":{"id":"meta-viewport","title":"`[user-scalable=\"no\"]` não é usado no elemento `\u003cmeta name=\"viewport\">`, e o atributo `[maximum-scale]` não é menor que 5.","description":"A desativação do zoom gera problemas para usuários com baixa visão que utilizam a ampliação de tela para enxergar corretamente o conteúdo de uma página da Web. [Saiba mais sobre a metatag viewport](https://dequeuniversity.com/rules/axe/4.12/meta-viewport).","score":1,"scoreDisplayMode":"binary","details":{"type":"table","headings":[{"key":"node","valueType":"node","subItemsHeading":{"key":"relatedNode","valueType":"node"},"label":"Elementos com falha"}],"items":[]}},"object-alt":{"id":"object-alt","title":"Os elementos `\u003cobject>` têm texto alternativo","description":"Os leitores de tela não traduzem conteúdo não textual. A adição de texto alternativo a elementos `\u003cobject>` ajuda os leitores de tela a transmitir o significado para os usuários. [Saiba mais sobre texto alternativo para elementos `object`](https://dequeuniversity.com/rules/axe/4.12/object-alt).","score":null,"scoreDisplayMode":"notApplicable"},"select-name":{"id":"select-name","title":"Os elementos de \u003cselect> têm elementos de \u003clabel> associados.","description":"Elementos de \u003cform> sem rótulos eficazes podem criar experiênci
