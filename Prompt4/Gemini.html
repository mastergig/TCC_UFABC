<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estúdio de Fotografia</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <header class="header">
    <div class="logo">Lumina Studio</div>
    <nav class="nav">
      <a href="#produtos">Produtos</a>
      <a href="#contato">Contato</a>
    </nav>
    <div class="cart-icon">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count">0</span>
    </div>
  </header>

  <main>
    <section id="produtos" class="products-section">
      <h2>Produtos em Destaque</h2>
      <div class="product-grid">
        <article class="product-card">
          <img src="https://via.placeholder.com/300x200" alt="Ensaio Fotográfico">
          <div class="product-info">
            <h3>Ensaio Retrato</h3>
            <p class="price">R$ 450,00</p>
            <button class="btn-buy">Adicionar ao Carrinho</button>
          </div>
        </article>

        <article class="product-card">
          <img src="https://via.placeholder.com/300x200" alt="Quadro Decorativo">
          <div class="product-info">
            <h3>Quadro Fine Art 60x40</h3>
            <p class="price">R$ 290,00</p>
            <button class="btn-buy">Adicionar ao Carrinho</button>
          </div>
        </article>

        <article class="product-card">
          <img src="https://via.placeholder.com/300x200" alt="Álbum de Fotos">
          <div class="product-info">
            <h3>Álbum Linho 30x30</h3>
            <p class="price">R$ 680,00</p>
            <button class="btn-buy">Adicionar ao Carrinho</button>
          </div>
        </article>
      </div>
    </section>

    <section id="contato" class="contact-section">
      <h2>Entre em Contato</h2>
      <form action="mailto:contato@estudio.com" method="post" enctype="text/plain" class="contact-form">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Mensagem</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn-submit">Enviar E-mail</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Lumina Studio. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
