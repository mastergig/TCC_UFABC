<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Estúdio de Fotografia</title>
    <style>
        /* --- RESET E VARIÁVEIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #e0e0e0;
            --accent-color: #c9a050;
            --text-color: #a0a0a0;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --nav-height: 70px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: var(--font-main);
            line-height: 1.6;
        }

        /* --- NAVEGAÇÃO FIXA --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(5px);
            z-index: 1000;
            border-bottom: 1px solid #2a2a2a;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        /* --- SEÇÕES GERAIS --- */
        section {
            padding: 100px 20px 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 2px;
            background-color: var(--accent-color);
            margin: 10px auto 0 auto;
        }

        /* --- HERO SECTION --- */
        #home {
            height: 100vh;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1452587925148-ce544e77e70d?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            padding: 0 20px;
        }

        #home h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        #home p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--accent-color);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        /* --- GALERIA (GRID FLEXÍVEL) --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            aspect-ratio: 4 / 3;
            background-color: var(--surface-color);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay h3 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .gallery-overlay p {
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        /* --- SOBRE NÓS (FLEXBOX) --- */
        .about-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 40px;
        }

        .about-image {
            flex: 1 1 400px;
        }

        .about-image img {
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .about-text {
            flex: 1 1 400px;
        }

        .about-text p {
            margin-bottom: 20px;
            color: var(--text-color);
        }

        /* --- CONTATO --- */
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--surface-color);
            padding: 40px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid #333;
            color: var(--primary-color);
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-group textarea {
            resize: vertical;
            height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border-radius: 4px;
        }

        .submit-btn:hover {
            background-color: #b38b40;
        }

        /* --- RODAPÉ --- */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #0a0a0a;
            color: var(--text-color);
            font-size: 0.85rem;
            border-top: 1px solid #1f1f1f;
        }

        /* --- RESPONSIVIDADE PARA MENU MOBILE --- */
        @media (max-width: 768px) {
            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 0.8rem;
            }

            #home h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO FIXA -->
    <header>
        <nav>
            <div class="logo">Lumina<span>.</span></div>
            <ul class="nav-links">
                <li><a href="#home">Início</a></li>
                <li><a href="#galeria">Galeria</a></li>
                <li><a href="#sobre">Sobre Nós</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- INÍCIO / HERO -->
    <section id="home">
        <h1>Capturando Momentos Únicos</h1>
        <p>Fotografia profissional de retratos, eventos e arquitetura</p>
        <a href="#galeria" class="btn">Ver Portfólio</a>
    </section>

    <!-- GALERIA DE FOTOS -->
    <section id="galeria">
        <h2 class="section-title">Portfólio</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Retrato Urbano">
                <div class="gallery-overlay">
                    <h3>Retrato Urbano</h3>
                    <p>Ensaio Editorial</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=600&q=80" alt="Casamento">
                <div class="gallery-overlay">
                    <h3>Celebração</h3>
                    <p>Cobertura de Eventos</p>
                </div>
            </div>
            <div class="gallery-item">
                <img
